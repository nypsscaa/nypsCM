<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ruby's Restaurant 點餐大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 餐廳風格：奶油色底、番茄紅主色。A 隊番茄紅、B 隊青綠。 */
:root{
  --ink:#3a2418; --ink-soft:#7a5b48;
  --paper:#fbf4e8; --card:#fffdf8; --line:#ecdcc4;
  --accent:#d1482b; --accent-soft:#fbe5dc;
  --ok:#2e8b57; --ok-bg:#e4f4ea; --bad:#c2465a; --bad-bg:#fbe7ea; --warn:#c98a12; --warn-bg:#fdf3dc;
  --tA:#e4572e; --tA-bg:#fde6dd; --tB:#1f8a7d; --tB-bg:#dcf2ee;
  --display:'LXGW WenKai TC','Noto Sans TC','PingFang TC',sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --en:'Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.35;cursor:not-allowed}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.en{font-family:var(--en);font-weight:800;letter-spacing:.01em}
.wrap{max-width:1100px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}
.sub{color:var(--ink-soft);font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.btn{padding:12px 20px;border-radius:14px;font-weight:800;background:var(--accent);color:#fff;min-height:50px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn)}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn.big{font-size:24px;min-height:72px;padding:14px 28px;border-radius:18px}
.btn.arm{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.link{color:var(--ink-soft);text-decoration:underline;font-size:14px;padding:6px}
.conn{position:fixed;left:50%;top:8px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:99px;font-size:14px;z-index:90}

/* 開始畫面 */
.hero{text-align:center;margin:24px 0 20px}
.hero .logo{font-size:64px;line-height:1}
.hero h1{font-size:38px;margin-top:6px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.role{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:22px 10px;text-align:center}
.role .ic{font-size:48px;display:block}
.role b{font-family:var(--display);font-size:26px;display:block}
.role small{color:var(--ink-soft);font-size:14px}
.role:active{transform:scale(.97)}
.role .seat{font-family:var(--en);font-weight:900;font-size:22px;color:var(--accent)}
.mine{text-align:center;font-size:22px;font-weight:800;margin-top:6px}
.mine b{font-family:var(--display);font-size:34px;color:var(--accent)}
.sw{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sw button{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:18px}
.sw button small{color:var(--ink-soft);font-weight:500;font-size:13px}
.sw button.on{border-color:var(--accent);background:var(--accent-soft)}

/* 上方狀態列 */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .me{font-weight:900;font-family:var(--display);font-size:20px}
.bar .rd{font-size:15px;opacity:.85}
.bar .timer{font-family:var(--en);font-weight:900;font-size:30px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.bar .timer.low{color:#ffb4a2}
.bar .sc{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-weight:800;font-size:16px}
.chip.A{background:var(--tA);color:#fff}.chip.B{background:var(--tB);color:#fff}
.bar .link{color:#e8d8c8}

/* 通用區塊 */
.panel{margin-top:14px}
.say{background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:12px;padding:10px 14px;margin:8px 0}
.say .who{font-size:13px;color:var(--ink-soft);font-weight:700}
.say .line{font-size:24px}
.say.done{opacity:.45}
.notice{text-align:center;padding:40px 16px}
.notice .ic{font-size:72px;line-height:1.1}
.notice h2{font-size:32px;margin-top:8px}
.notice p{color:var(--ink-soft);font-size:18px;margin:8px 0 0}

/* 菜單／架子格子 */
.gridT{font-weight:900;margin:14px 0 6px;font-family:var(--display);font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.it{position:relative;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 4px 6px;text-align:center;min-height:96px}
.it .pic{font-size:42px;line-height:1.1;position:relative;display:inline-block}
.it .pic .bd{position:absolute;right:-12px;bottom:-4px;font-size:22px}
.it .w{display:block;font-family:var(--en);font-weight:800;font-size:16px;margin-top:2px}
.it.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent) inset}
.grid.pics .it{min-height:84px;padding:10px 4px}
.grid.pics .it .pic{font-size:48px}
.qty{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qty button{width:54px;height:54px;border-radius:12px;background:var(--card);border:3px solid var(--line);font-family:var(--en);font-weight:900;font-size:22px}
.qty button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.ticket{position:sticky;bottom:0;z-index:10;margin-top:14px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:max(0px,env(safe-area-inset-bottom))}
.ticket .t{flex:1;font-size:22px;min-width:200px}
.ticket .t small{display:block;font-size:13px;opacity:.7;font-family:var(--body)}

/* 客人點餐卡 */
.order{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dish{background:var(--card);border:3px dashed var(--accent);border-radius:20px;text-align:center;padding:16px 8px}
.dish .k{font-size:15px;color:var(--ink-soft);font-weight:700}
.dish .pic{font-size:84px;line-height:1.15;position:relative;display:inline-block}
.dish .pic .bd{position:absolute;right:-22px;bottom:0;font-size:40px}
.dish .n{font-family:var(--en);font-weight:900;font-size:44px;color:var(--accent);margin-left:10px;vertical-align:middle}
.dish .w{display:block;font-family:var(--en);font-weight:800;font-size:28px}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ex{border-radius:16px;padding:10px;text-align:center;font-size:18px;font-weight:800}
.ex .pic{font-size:44px;position:relative;display:inline-block}
.ex .pic .bd{position:absolute;right:-14px;bottom:-2px;font-size:22px}
.ex.yes{background:var(--ok-bg);color:var(--ok);border:3px solid var(--ok)}
.ex.no{background:var(--bad-bg);color:var(--bad);border:3px solid var(--bad)}
.ex .w{display:block;font-family:var(--en);color:var(--ink)}

/* 廚房點單 */
.slip{background:#fff;border:2px solid var(--line);border-radius:6px;padding:16px 20px;box-shadow:0 6px 0 var(--line);max-width:520px;margin:0 auto}
.slip .h{font-size:14px;color:var(--ink-soft);border-bottom:2px dashed var(--line);padding-bottom:6px;margin-bottom:8px}
.slip .l{font-family:var(--en);font-weight:900;font-size:34px;line-height:1.3}
.plate{display:flex;gap:16px;justify-content:center;align-items:center;font-size:52px;min-height:70px}
.plate .n{font-family:var(--en);font-weight:900;font-size:30px;color:var(--accent)}

/* 評審 */
.chal{width:100%;min-height:150px;font-size:44px;font-family:var(--display);border-radius:24px;background:var(--bad);color:#fff;font-weight:900;box-shadow:0 8px 0 #8f2b3c}
.chal:active{transform:translateY(4px);box-shadow:0 4px 0 #8f2b3c}

/* 大螢幕 */
.board{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:18px;align-items:stretch;margin-top:10px}
.bt{border-radius:24px;padding:18px;text-align:center;color:#fff}
.bt.A{background:var(--tA)}.bt.B{background:var(--tB)}
.bt .nm{font-family:var(--display);font-size:34px;font-weight:900}
.bt .pts{font-family:var(--en);font-weight:900;font-size:96px;line-height:1}
.bt .mem{font-size:18px;opacity:.95}
.bt.dim{opacity:.55}
.bigtime{font-family:var(--en);font-weight:900;font-size:150px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bigtime.low{color:var(--bad)}
.steps{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.steps span{padding:6px 14px;border-radius:99px;background:var(--line);font-weight:800;font-size:18px}
.steps span.on{background:var(--accent);color:#fff}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cast div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:16px}
.cast b{display:block;font-size:24px;font-family:var(--display)}

/* 表格 */
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
th{color:var(--ink-soft);font-weight:700;font-size:14px}
tr.cur td{background:var(--accent-soft)}

/* 疊層 */
.overlay{position:fixed;inset:0;background:rgba(40,20,10,.78);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .box{background:var(--card);border-radius:24px;padding:28px 24px;text-align:center;max-width:560px;width:100%}
.overlay .box .ic{font-size:72px;line-height:1.1}
.overlay .box h2{font-size:34px}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:70;padding:14px 26px;border-radius:18px;font-size:26px;font-weight:900;font-family:var(--display);
  box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .25s ease-out;max-width:92vw;text-align:center}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}.toast.info{background:var(--ink);color:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:360px}
.modal input{width:100%;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);margin:12px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tm{border-radius:16px;padding:12px}
.tm.A{background:var(--tA-bg);border:2px solid var(--tA)}.tm.B{background:var(--tB-bg);border:2px solid var(--tB)}
.tm h3{font-size:22px}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:12px;overflow:hidden}
.seg button{padding:6px 14px;font-weight:800;color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
@media (max-width:700px){
  .order,.extra{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .bigtime{font-size:96px}
  .bar .timer{font-size:24px}
  .say .line{font-size:20px}
  .overlay .row{flex-direction:column;align-items:stretch}
  th,td{padding:5px 3px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="conn" class="conn">連線中…</div>

<!-- 選角色 -->
<section id="v-start" class="wrap" hidden>
  <div class="hero">
    <div class="logo">🍽️</div>
    <h1>Ruby's Restaurant 點餐大挑戰</h1>
    <p class="sub">你是誰？點自己的名字</p>
  </div>
  <div class="roles" id="names"></div>
  <div class="row" style="justify-content:center;margin-top:28px;gap:24px">
    <button class="link" data-role="board">📺 大螢幕</button>
    <button class="link" data-role="teacher">🧑‍🏫 老師</button>
  </div>
</section>

<!-- 主畫面 -->
<section id="v-main" hidden>
  <div class="bar">
    <span class="me" id="b-me"></span>
    <span class="rd" id="b-rd"></span>
    <span class="grow"></span>
    <span class="timer" id="b-timer">--</span>
    <span class="grow"></span>
    <span class="sc" id="b-sc"></span>
    <button class="link" id="b-switch">換角色</button>
  </div>
  <main class="wrap" id="stage"></main>
</section>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<div id="m-pass" class="modal" hidden>
  <div class="box">
    <h3>老師密碼</h3>
    <input id="m-pass-in" type="password" autocomplete="off">
    <div class="row spread"><button class="btn ghost small" id="m-pass-x">取消</button><button class="btn small" id="m-pass-ok">進入</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, runTransaction, setDoc, addDoc, getDocs,
         serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { ROSTER as CLASS_ROSTER, TEACHER_PASSWORD, firebaseConfig, APP_ID } from './config.js';

/* ══════════════════════════════════════════════════════════════════
   ①  設定 —— 名單與密碼在 config.js
   ══════════════════════════════════════════════════════════════════ */
const GRADE = '6';
const ROSTER = CLASS_ROSTER[GRADE];   // 名單在 config.js
const PENALTY_SEC = 5;          // 挑戰成立扣的秒數
const ROUNDS = 6;               // 2 隊 × 每人輪 3 個角色
const DURATIONS = [60, 90, 120, 150];

/* 單字（課本 Food / Drinks 表）
   count:true → 用 a / an / 數字（card 會出 1–10）；count:false → 用 some
   bd = 小角標，用來分辨長得像的飲料（咖啡/熱可可、牛奶/豆漿、可樂/檸檬水） */
const FOODS = [
  { id:'apple',     en:'apple',        pl:'apples',      zh:'蘋果',   e:'🍎', count:true },
  { id:'banana',    en:'banana',       pl:'bananas',     zh:'香蕉',   e:'🍌', count:true },
  { id:'grapes',    en:'grapes',                         zh:'葡萄',   e:'🍇', count:false },
  { id:'guava',     en:'guava',        pl:'guavas',      zh:'芭樂',   e:'🍐', count:true },
  { id:'orange',    en:'orange',       pl:'oranges',     zh:'柳橙',   e:'🍊', count:true },
  { id:'papaya',    en:'papaya',       pl:'papayas',     zh:'木瓜',   e:'🥭', count:true },
  { id:'pineapple', en:'pineapple',    pl:'pineapples',  zh:'鳳梨',   e:'🍍', count:true },
  { id:'dumplings', en:'dumplings',                      zh:'水餃',   e:'🥟', count:false },
  { id:'fries',     en:'French fries',                   zh:'薯條',   e:'🍟', count:false },
  { id:'hamburger', en:'hamburger',    pl:'hamburgers',  zh:'漢堡',   e:'🍔', count:true },
  { id:'hotdog',    en:'hot dog',      pl:'hot dogs',    zh:'熱狗',   e:'🌭', count:true },
  { id:'icecream',  en:'ice cream',                      zh:'冰淇淋', e:'🍦', count:false },
  { id:'noodles',   en:'noodles',                        zh:'麵',     e:'🍜', count:false },
  { id:'pizza',     en:'pizza',        pl:'pizzas',      zh:'披薩',   e:'🍕', count:true },
  { id:'rice',      en:'rice',                           zh:'飯',     e:'🍚', count:false },
  { id:'sandwich',  en:'sandwich',     pl:'sandwiches',  zh:'三明治', e:'🥪', count:true },
  { id:'soup',      en:'soup',                           zh:'湯',     e:'🍲', count:false },
  { id:'steak',     en:'steak',        pl:'steaks',      zh:'牛排',   e:'🥩', count:true }
];
const DRINKS = [
  { id:'bubbletea', en:'bubble tea',     zh:'珍珠奶茶', e:'🧋' },
  { id:'coffee',    en:'coffee',         zh:'咖啡',     e:'☕' },
  { id:'hotchoc',   en:'hot chocolate',  zh:'熱巧克力', e:'☕', bd:'🍫' },
  { id:'cola',      en:'cola',           zh:'可樂',     e:'🥤' },
  { id:'lemonade',  en:'lemonade',       zh:'檸檬水',   e:'🥤', bd:'🍋' },
  { id:'juice',     en:'juice',          zh:'果汁',     e:'🧃' },
  { id:'milk',      en:'milk',           zh:'牛奶',     e:'🥛' },
  { id:'soymilk',   en:'soy milk',       zh:'豆漿',     e:'🥛', bd:'🫘' },
  { id:'tea',       en:'tea',            zh:'茶',       e:'🍵' },
  { id:'water',     en:'water',          zh:'水',       e:'💧' }
];

/* ══════════════════════════════════════════════════════════════════
   ②  Firebase（與 index.html 同一個專案、同一個 APP_ID）
   ══════════════════════════════════════════════════════════════════ */
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const docRef = (col, id) => doc(db, 'artifacts', APP_ID, 'public', 'data', col, id);
const colRef = (col)     => collection(db, 'artifacts', APP_ID, 'public', 'data', col);
const gameRef = docRef(`restaurant_${GRADE}`, 'current');   // 比賽進行中的共用狀態
const logCol  = colRef(`restaurantLog_${GRADE}`);           // 按「結束本堂」才寫入

/* ══════════════════════════════════════════════════════════════════
   ③  小工具與句子
   ══════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const ITEM = Object.fromEntries([...FOODS, ...DRINKS].map(i => [i.id, i]));
const NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rand = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rand(a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const nameOf = (seat) => (ROSTER.find(r => r.seat === seat) || {}).name || '?';
const TEAM = ['A', 'B'];
const pic = (id, cls = 'pic') => { const it = ITEM[id]; return `<span class="${cls}">${it.e}${it.bd ? `<span class="bd">${it.bd}</span>` : ''}</span>`; };

const article = (it) => /^[aeiou]/i.test(it.en) ? 'an' : 'a';
function foodPhrase(id, qty) {
  const it = ITEM[id];
  if (!it.count) return 'some ' + it.en;
  return qty === 1 ? `${article(it)} ${it.en}` : `${NUM[qty]} ${it.pl}`;
}
const drinkPhrase = (id) => 'some ' + ITEM[id].en;
const offerPhrase = (id) => { const it = ITEM[id]; return 'some ' + (it.count ? it.pl : it.en); };

function newCard() {
  const f = pick(FOODS), d = pick(DRINKS);
  const qty = f.count ? (Math.random() < .3 ? 1 : 2 + rand(9)) : 0;   // 1–10，約三成是 a / an
  const pool = shuffle([...FOODS, ...DRINKS].filter(i => i.id !== f.id && i.id !== d.id));
  const want = pool[0].id, nope = pool[1].id;
  return { food: f.id, qty, drink: d.id, want, nope, offer: Math.random() < .5 ? want : nope };
}
function roundInfo(s, i = s.roundIdx) {
  if (!s.teams) return null;
  const team = i % 2, rot = Math.floor(i / 2), m = s.teams[team].members;
  return { team, rot, waiter: m[rot % 3], customer: m[(rot + 1) % 3], chef: m[(rot + 2) % 3] };
}
const teamTotal = (s, t) => s.results.filter(r => r.team === t).reduce((a, r) => a + r.score, 0)
  + ((s.status === 'running' || s.status === 'paused') && roundInfo(s)?.team === t ? s.score : 0);

/* ══════════════════════════════════════════════════════════════════
   ④  遊戲狀態：所有改動都走 transaction，多台平板同時按也不會打架
   ══════════════════════════════════════════════════════════════════ */
const blank = () => ({ teams: null, duration: 90, roundIdx: 0, status: 'idle', endAt: 0, remaining: 0,
  score: 0, wrong: 0, challenges: 0, penalties: 0, results: [], order: null, pause: null, last: null, n: 0 });

let G = blank();          // 最新的雲端狀態
let ready = false;

function newOrder(s) { s.n = (s.n || 0) + 1; s.order = { n: s.n, t: 0, card: newCard(), stage: 'order', ticket: null, plate: null }; }
function say(s, kind, text) { s.last = { kind, text, at: Date.now(), id: Math.random().toString(36).slice(2) }; }
function finishRound(s) {
  const ri = roundInfo(s);
  s.results.push({ idx: s.roundIdx, team: ri.team, rot: ri.rot, waiter: ri.waiter, customer: ri.customer, chef: ri.chef,
    score: s.score, wrong: s.wrong, challenges: s.challenges, penalties: s.penalties });
  s.status = 'over'; s.order = null; s.pause = null; s.remaining = 0;
  say(s, 'info', `⏰ 本局結束！${TEAM[ri.team]} 隊上了 ${s.score} 道菜`);
}
const live = (s) => s.status === 'running' && Date.now() < s.endAt;

async function act(fn) {
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(gameRef);
      const s = Object.assign(blank(), snap.exists() ? snap.data() : {});
      if (fn(s) === false) return;
      tx.set(gameRef, JSON.parse(JSON.stringify(s)));
    });
  } catch (e) { console.error(e); showToast({ kind: 'bad', text: '連線有問題，請再按一次' }, true); }
}

const A = {
  group: () => act(s => {
    const seats = shuffle(ROSTER.map(r => r.seat));
    Object.assign(s, blank(), { duration: s.duration, status: 'ready',
      teams: [{ members: seats.slice(0, 3) }, { members: seats.slice(3, 6) }] });
  }),
  duration: (d) => act(s => { s.duration = d; }),
  swap: (a, b) => act(s => {
    if (s.status !== 'ready' || s.results.length || !s.teams) return false;
    const pos = (x) => { for (let t = 0; t < 2; t++) { const i = s.teams[t].members.indexOf(x); if (i >= 0) return [t, i]; } };
    const [ta, ia] = pos(a), [tb, ib] = pos(b);
    s.teams[ta].members[ia] = b; s.teams[tb].members[ib] = a;
  }),
  start: () => act(s => {
    if (s.status !== 'ready') return false;
    Object.assign(s, { status: 'running', endAt: Date.now() + s.duration * 1000, score: 0, wrong: 0, challenges: 0, penalties: 0, pause: null });
    newOrder(s); say(s, 'info', '開始！');
  }),
  send: (n, ticket) => act(s => {
    if (!live(s) || !s.order || s.order.n !== n || s.order.stage !== 'order') return false;
    s.order.ticket = ticket; s.order.stage = 'cook';
  }),
  cooked: (n, plate) => act(s => {
    if (!live(s) || !s.order || s.order.n !== n || s.order.stage !== 'cook') return false;
    s.order.plate = plate; s.order.stage = 'serve';
  }),
  answer: (n, yes) => act(s => {
    if (!live(s) || !s.order || s.order.n !== n || s.order.stage !== 'serve') return false;
    const c = s.order.card, p = s.order.plate;
    const dishOk = p.food === c.food && p.drink === c.drink && (!ITEM[c.food].count || p.qty === c.qty);
    const offerOk = yes === (c.offer === c.want);
    if (!dishOk) {
      s.wrong++; say(s, 'bad', '❌ 送錯菜了！服務生重新點餐');
      Object.assign(s.order, { stage: 'order', ticket: null, plate: null, t: (s.order.t || 0) + 1 });
    } else if (!offerOk) {
      s.wrong++; say(s, 'warn', '⚠️ 菜對了，但加點聽錯了，換下一位客人'); newOrder(s);
    } else {
      s.score++; say(s, 'ok', '✅ 上菜成功 +1'); newOrder(s);
    }
  }),
  challenge: (by, name) => act(s => {
    if (!live(s)) return false;
    s.status = 'paused'; s.remaining = Math.max(0, s.endAt - Date.now());
    s.pause = { by, name: name || '', at: Date.now(), stage: s.order ? s.order.stage : null }; s.challenges++;
  }),
  resolve: (isError) => act(s => {
    if (s.status !== 'paused') return false;
    if (isError) { s.remaining -= PENALTY_SEC * 1000; s.penalties++; say(s, 'bad', `⏱ 挑戰成立，扣 ${PENALTY_SEC} 秒`); }
    else say(s, 'info', '👍 沒有錯，繼續');
    s.pause = null;
    if (s.remaining <= 0) { finishRound(s); return; }
    s.status = 'running'; s.endAt = Date.now() + s.remaining; s.remaining = 0;
  }),
  timeUp: () => act(s => { if (s.status !== 'running' || Date.now() < s.endAt) return false; finishRound(s); }),
  endEarly: () => act(s => { if (s.status !== 'running' && s.status !== 'paused') return false; finishRound(s); }),
  skip: () => act(s => { if (!live(s)) return false; newOrder(s); say(s, 'info', '⏭ 換一位客人'); }),
  adjust: (d) => act(s => {
    if (s.status === 'running' || s.status === 'paused') s.score = Math.max(0, s.score + d);
    else if (s.results.length) { const r = s.results[s.results.length - 1]; r.score = Math.max(0, r.score + d); }
    else return false;
  }),
  next: () => act(s => {
    if (s.status !== 'over') return false;
    if (s.results.length >= ROUNDS) { s.status = 'done'; return; }
    s.roundIdx = s.results.length; s.status = 'ready';
  }),
  reset: () => act(s => { Object.assign(s, blank(), { duration: s.duration }); })
};

/* ══════════════════════════════════════════════════════════════════
   ⑤  畫面
   ══════════════════════════════════════════════════════════════════ */
const ROLE_LABEL = { waiter:'🧑‍💼 服務生', customer:'🙋 客人', chef:'🧑‍🍳 廚房', judge:'👂 評審', board:'📺 大螢幕', teacher:'🧑‍🏫 老師' };
const L = { role: null, seat: null, pickSeat: null, key: null, w: { food: null, qty: null, drink: null }, c: { food: null, qty: null, drink: null },
  shownLast: null, armed: null, logs: null };

/* 學生：依分組與輪替決定這台平板現在顯示哪個角色 */
function myRole() {
  if (L.role !== 'student') return L.role;
  const ri = roundInfo(G);
  if (ri && ['ready', 'running', 'paused'].includes(G.status)) {
    if (ri.waiter === L.seat) return 'waiter';
    if (ri.customer === L.seat) return 'customer';
    if (ri.chef === L.seat) return 'chef';
  }
  return 'judge';
}
function setSeat(seat) {
  L.role = 'student'; L.seat = seat; store.set('rest-seat', seat); store.del('rest-role');
  show('main'); render();
}
function renderNames() {
  $('names').innerHTML = ROSTER.map(r => `<button class="role" data-seat="${r.seat}"><span class="seat">${r.seat}</span><b>${esc(r.name)}</b></button>`).join('');
}
function show(v) { $('v-start').hidden = v !== 'start'; $('v-main').hidden = v !== 'main'; }
function setRole(r) {
  L.role = r; L.seat = null; store.del('rest-seat'); if (r !== 'teacher') store.set('rest-role', r);
  $('b-me').textContent = ROLE_LABEL[r]; show('main');
  if (r === 'teacher') loadLogs();
  render();
}

function orderKey() { return G.order ? `${G.order.n}-${G.order.t || 0}` : null; }
function remainMs() {
  if (G.status === 'running') return Math.max(0, G.endAt - Date.now());
  if (G.status === 'paused') return Math.max(0, G.remaining);
  if (G.status === 'ready') return G.duration * 1000;
  return 0;
}
const fmt = (ms) => { const t = Math.ceil(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

function renderBar() {
  const ri = roundInfo(G);
  $('b-me').textContent = L.role === 'student' ? `${nameOf(L.seat)}｜${ROLE_LABEL[myRole()].split(' ')[1]}` : ROLE_LABEL[L.role];
  $('b-switch').textContent = L.role === 'student' ? '不是我' : '換角色';
  const rd = { idle: '等老師分組', ready: `第 ${G.roundIdx + 1} 局準備`, running: `第 ${G.roundIdx + 1} 局`, paused: `第 ${G.roundIdx + 1} 局・暫停`,
    over: `第 ${G.roundIdx + 1} 局結束`, done: '全部結束' }[G.status] || '';
  $('b-rd').textContent = rd + (ri && ['ready','running','paused','over'].includes(G.status) ? `｜${TEAM[ri.team]} 隊` : '');
  $('b-sc').innerHTML = G.teams ? TEAM.map((t, i) => `<span class="chip ${t}">${t} ${teamTotal(G, i)}</span>`).join('') : '';
  tick();
}
function tick() {
  const ms = remainMs(), el = $('b-timer');
  el.textContent = G.status === 'idle' || G.status === 'done' ? '--' : fmt(ms);
  el.classList.toggle('low', G.status === 'running' && ms <= 10000);
  const bt = document.querySelector('.bigtime');
  if (bt) { bt.textContent = el.textContent; bt.classList.toggle('low', el.classList.contains('low')); }
  if (G.status === 'running' && Date.now() >= G.endAt && !tick.busy) { tick.busy = true; A.timeUp().finally(() => setTimeout(() => tick.busy = false, 800)); }
}

  return `<div class="board">${teamBox(0)}<div>${mid}</div>${teamBox(1)}</div>
    ${['ready','running','paused'].includes(G.status) ? castHTML(ri) : ''}
    ${G.status === 'ready' ? `<p class="sub" style="text-align:center;font-size:20px">第 ${G.roundIdx + 1} 局：${TEAM[ri.team]} 隊・廚師請到教室外</p>` : ''}
    ${resultsHTML()}`;
}
function resultsHTML() {
  if (!G.teams) return '';
  const rows = Array.from({ length: ROUNDS }, (_, i) => {
    const ri = roundInfo(G, i), r = G.results.find(x => x.idx === i);
    const cur = i === G.roundIdx && G.status !== 'done' && !r;
    return `<tr class="${cur ? 'cur' : ''}"><td>${i + 1}</td><td><span class="chip ${TEAM[ri.team]}">${TEAM[ri.team]}</span></td>
      <td>${esc(nameOf(ri.waiter))}</td><td>${esc(nameOf(ri.customer))}</td><td>${esc(nameOf(ri.chef))}</td>
      <td><b>${r ? r.score : (cur && (G.status === 'running' || G.status === 'paused') ? G.score : '')}</b></td>
      <td>${r ? r.penalties : ''}</td></tr>`;
  }).join('');
  return `<div class="card panel"><table><thead><tr><th>局</th><th>隊</th><th>服務生</th><th>客人</th><th>廚師</th><th>上菜</th><th>扣秒</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* 老師 */
function armBtn(id, label, cls = 'ghost') {
  const on = L.armed === id;
  return `<button class="btn small ${cls} ${on ? 'arm' : ''}" data-arm="${id}">${on ? '再按一次確認' : label}</button>`;
}
function teacherHTML() {
  const ri = roundInfo(G);
  let main = '';
  const dur = `<div class="row"><span class="sub">每局秒數</span><span class="seg">${DURATIONS.map(d => `<button class="${G.duration === d ? 'on' : ''}" data-dur="${d}">${d}</button>`).join('')}</span></div>`;
  const canSwap = G.status === 'ready' && G.results.length === 0;
  const RN = ['服務生', '客人', '廚師'];
  const teams = G.teams && canSwap ? `<div class="teams panel">${[0, 1].map(t => `<div class="tm ${TEAM[t]}"><h3>${TEAM[t]} 隊</h3><div class="sub">第一次上場的角色（之後自動輪替）</div>
      <div class="sw">${G.teams[t].members.map((m, i) => `<button class="${L.pickSeat === m ? 'on' : ''}" data-pick="${m}">${esc(nameOf(m))}<small>${RN[i]}</small></button>`).join('')}</div></div>`).join('')}</div>
      <p class="sub">${L.pickSeat ? `已選 ${esc(nameOf(L.pickSeat))}，再點一個人跟他互換` : '想調整就點兩個名字互換（可跨隊）'}</p>` : G.teams ? `<div class="teams panel">${[0, 1].map(t => `<div class="tm ${TEAM[t]}"><h3>${TEAM[t]} 隊 <span class="sub">${teamTotal(G, t)} 分</span></h3>${G.teams[t].members.map(nameOf).map(esc).join('、')}</div>`).join('')}</div>` : '';
  if (G.status === 'idle') {
    main = `<div class="card"><h2>點餐大挑戰・${GRADE} 年級</h2><p class="sub">6 人隨機分成 2 隊，每隊 3 人輪流當服務生、客人、廚師，共 ${ROUNDS} 局。</p>
      ${dur}<div class="row panel"><button class="btn big" data-act="group">🎲 隨機分組</button></div></div>`;
  } else if (G.status === 'ready') {
    main = `<div class="card"><h2>第 ${G.roundIdx + 1} 局：${TEAM[ri.team]} 隊</h2>${castHTML(ri)}
      <p class="sub">確認廚師在教室外。另一隊的平板會自動變成評審。</p>${dur}
      <div class="row panel"><button class="btn big ok" data-act="start">▶ 開始計時</button>
      ${G.results.length === 0 ? '<button class="btn small ghost" data-act="group">🎲 重新分組</button>' : ''}</div></div>`;
  } else if (G.status === 'running' || G.status === 'paused') {
    main = `<div class="card"><div class="row spread"><h2>第 ${G.roundIdx + 1} 局：${TEAM[ri.team]} 隊・本局 ${G.score} 分</h2>
      <div class="row"><button class="btn small ghost" data-adj="-1">−1</button><button class="btn small ghost" data-adj="1">+1</button></div></div>
      ${G.status === 'running' ? `<div class="row panel"><button class="btn big bad grow" data-act="challenge">⏸ 老師挑戰／暫停</button></div>` : ''}
      <div class="panel">${linesHTML()}</div>
      <div class="row panel"><button class="btn small ghost" data-act="skip" ${G.status === 'running' ? '' : 'disabled'}>⏭ 換一位客人</button>${armBtn('end', '⏹ 提早結束這局')}</div></div>`;
  } else if (G.status === 'over') {
    const r = G.results[G.results.length - 1];
    main = `<div class="card"><h2>第 ${G.roundIdx + 1} 局結束：${TEAM[ri.team]} 隊 ${r.score} 道菜</h2>
      <p class="sub">送錯 ${r.wrong} 次・被挑戰 ${r.challenges} 次・扣秒 ${r.penalties} 次</p>
      <div class="row"><button class="btn small ghost" data-adj="-1">−1</button><button class="btn small ghost" data-adj="1">+1</button></div>
      <div class="row panel"><button class="btn big" data-act="next">${G.results.length >= ROUNDS ? '🏆 看總成績' : '➜ 下一局'}</button></div></div>`;
  } else if (G.status === 'done') {
    main = `<div class="card" style="text-align:center"><h2>🏆 ${winnerText()}</h2><p class="sub">按「結束本堂」把成績存起來。</p></div>`;
  }
  const logs = L.logs ? `<div class="card panel"><h3>已存的紀錄</h3>${L.logs.length ? `<table><thead><tr><th>日期</th><th>A 隊</th><th>B 隊</th></tr></thead><tbody>${
      L.logs.map(l => `<tr><td>${esc(l.date || '')}</td><td>${l.totals?.[0] ?? ''}（${esc((l.teams?.[0] || []).join('、'))}）</td><td>${l.totals?.[1] ?? ''}（${esc((l.teams?.[1] || []).join('、'))}）</td></tr>`).join('')
    }</tbody></table>` : '<p class="sub">還沒有紀錄</p>'}</div>` : '';
  return `${main}${teams}${resultsHTML()}
    <div class="row panel">${G.teams ? armBtn('save', '💾 結束本堂（存檔）', 'ok') : ''}${armBtn('reset', '🗑 重設（不存檔）')}</div>${logs}`;
}

function render() {
  if (!L.role || !ready) return;
  const role = myRole();
  const k = role + ':' + orderKey();
  if (k !== L.key) { L.key = k; L.w = { food: null, qty: null, drink: null }; L.c = { food: null, qty: null, drink: null }; }
  const scrollY = window.scrollY;
  $('stage').innerHTML = ({ waiter: waiterHTML, customer: customerHTML, chef: chefHTML, judge: judgeHTML, board: boardHTML, teacher: teacherHTML })[role]();
  window.scrollTo(0, scrollY);
  renderBar(); renderOverlay(); maybeToast();
}

function renderOverlay() {
  const ov = $('overlay');
  if (G.status !== 'paused') { ov.hidden = true; return; }
  const by = G.pause?.by === 'teacher' ? '老師' : `評審 ${G.pause?.name || ''} `;
  if (L.role === 'teacher') {
    ov.innerHTML = `<div class="box"><div class="ic">🙋</div><h2>${by}提出挑戰</h2><p class="sub">計時已暫停，剩 ${fmt(G.remaining)}。剛剛的句子有錯嗎？</p>
      <div class="row panel"><button class="btn big bad grow" data-res="1">真的有錯 −${PENALTY_SEC} 秒</button><button class="btn big ok grow" data-res="0">沒有錯，繼續</button></div></div>`;
  } else {
    ov.innerHTML = `<div class="box"><div class="ic">⏸</div><h2>${by}挑戰！</h2><p class="sub">計時暫停，等老師判定。</p></div>`;
  }
  ov.hidden = false;
}

let toastT = null;
function showToast(m, force) {
  const t = $('toast'); t.className = 'toast ' + m.kind; t.textContent = m.text; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
  if (!force) beep(m.kind);
}
function maybeToast() {
  const m = G.last; if (!m || m.id === L.shownLast) return;
  const first = L.shownLast === null; L.shownLast = m.id;
  if (first || Date.now() - m.at > 4000) return;   // 剛打開頁面時不跳舊訊息
  showToast(m);
}

/* 音效：只有大螢幕和老師端會響 */
let ac = null;
function beep(kind) {
  if (L.role !== 'board' && L.role !== 'teacher') return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ok: [660, 880], bad: [300, 220], warn: [440, 330], info: [520] }[kind] || [520];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * .13;
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(.25, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + .25);
    });
  } catch {}
}

/* ══════════════════════════════════════════════════════════════════
   ⑥  按鈕
   ══════════════════════════════════════════════════════════════════ */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.role) {
    if (d.role === 'teacher') { $('m-pass').hidden = false; $('m-pass-in').value = ''; $('m-pass-in').focus(); return; }
    setRole(d.role); return;
  }
  if (b.id === 'b-switch') { store.del('rest-role'); store.del('rest-seat'); L.role = null; L.seat = null; show('start'); $('overlay').hidden = true; return; }
  if (d.arm) {
    if (L.armed !== d.arm) { L.armed = d.arm; render(); setTimeout(() => { if (L.armed === d.arm) { L.armed = null; render(); } }, 3000); return; }
    L.armed = null;
    if (d.arm === 'end') await A.endEarly();
    if (d.arm === 'reset') await A.reset();
    if (d.arm === 'save') await saveClass();
    return;
  }
  if (!ready) return;
  const o = G.order;
  if (d.wFood) { L.w.food = d.wFood; L.w.qty = null; render(); return; }
  if (d.wQty) { L.w.qty = +d.wQty; render(); return; }
  if (d.wDrink) { L.w.drink = d.wDrink; render(); return; }
  if (d.cFood) { L.c.food = d.cFood; L.c.qty = null; render(); return; }
  if (d.cQty) { L.c.qty = +d.cQty; render(); return; }
  if (d.cDrink) { L.c.drink = d.cDrink; render(); return; }
  if (d.dur) { A.duration(+d.dur); return; }
  if (d.pick) {
    const m = +d.pick;
    if (!L.pickSeat) { L.pickSeat = m; render(); return; }
    const a = L.pickSeat; L.pickSeat = null;
    if (a === m) { render(); return; }
    A.swap(a, m); return;
  }
  if (d.seat) { setSeat(+d.seat); return; }
  if (d.adj) { A.adjust(+d.adj); return; }
  if (d.res) { A.resolve(d.res === '1'); return; }
  if (d.ans && o) { b.disabled = true; A.answer(o.n, d.ans === 'yes'); return; }
  switch (d.act) {
    case 'group': A.group(); break;
    case 'start': A.start(); break;
    case 'next': A.next(); break;
    case 'skip': A.skip(); break;
    case 'challenge': A.challenge(L.role === 'teacher' ? 'teacher' : 'judge', L.seat ? nameOf(L.seat) : ''); break;
    case 'send': {
      const f = ITEM[L.w.food]; b.disabled = true;
      A.send(o.n, { food: L.w.food, qty: f.count ? L.w.qty : 0, drink: L.w.drink }); break;
    }
    case 'cooked': {
      const f = ITEM[L.c.food]; b.disabled = true;
      A.cooked(o.n, { food: L.c.food, qty: f.count ? L.c.qty : 0, drink: L.c.drink }); break;
    }
  }
});
function tryPass() {
  if ($('m-pass-in').value.trim() === TEACHER_PASSWORD) { $('m-pass').hidden = true; setRole('teacher'); }
  else { $('m-pass-in').value = ''; $('m-pass-in').placeholder = '密碼不對，再試一次'; }
}
$('m-pass-ok').onclick = tryPass;
$('m-pass-in').onkeydown = (e) => { if (e.key === 'Enter') tryPass(); };
$('m-pass-x').onclick = () => { $('m-pass').hidden = true; };

/* 結束本堂：把 6 局成績存成一筆紀錄，然後清空 */
async function saveClass() {
  const s = G;
  const d = new Date(), date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const rec = {
    date, grade: GRADE, duration: s.duration,
    teams: s.teams.map(t => t.members.map(nameOf)),
    totals: [0, 1].map(t => s.results.filter(r => r.team === t).reduce((a, r) => a + r.score, 0)),
    rounds: s.results.map(r => ({ round: r.idx + 1, team: TEAM[r.team], waiter: nameOf(r.waiter), customer: nameOf(r.customer), chef: nameOf(r.chef),
      score: r.score, wrong: r.wrong, challenges: r.challenges, penalties: r.penalties })),
    savedAt: serverTimestamp()
  };
  try {
    await addDoc(logCol, rec);
    await A.reset();
    showToast({ kind: 'ok', text: '💾 已存檔' }, true);
    loadLogs();
  } catch (e) { console.error(e); showToast({ kind: 'bad', text: '存檔失敗，請檢查網路再按一次' }, true); }
}
async function loadLogs() {
  try {
    const snap = await getDocs(logCol);
    L.logs = snap.docs.map(x => x.data()).sort((a, b) => (b.savedAt?.seconds || 0) - (a.savedAt?.seconds || 0)).slice(0, 8);
    render();
  } catch (e) { console.error(e); }
}

/* ══════════════════════════════════════════════════════════════════
   ⑦  啟動
   ══════════════════════════════════════════════════════════════════ */
setInterval(() => { if (L.role && ready) tick(); }, 250);
onAuthStateChanged(auth, (user) => {
  if (!user) return;
  onSnapshot(gameRef, (snap) => {
    G = Object.assign(blank(), snap.exists() ? snap.data() : {});
    $('conn').hidden = true;
    if (!ready) {
      ready = true; renderNames();
      const seat = store.get('rest-seat'), r = store.get('rest-role');
      if (seat && ROSTER.some(x => x.seat === seat)) setSeat(seat);
      else if (r === 'board') setRole(r);
      else show('start');
    }
    render();
  }, (err) => { $('conn').hidden = false; $('conn').textContent = '連線失敗，請重新整理（' + err.code + '）'; });
});
signInAnonymously(auth).catch(err => { $('conn').textContent = '連線失敗，請檢查網路後重新整理（' + err.code + '）'; });
</script>
</body>
