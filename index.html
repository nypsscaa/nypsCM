<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EngClass Pro - 數位互動課室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .student-card { transition: all 0.2s ease-in-out; }
        .student-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .drawing-board { border: 2px dashed #cbd5e1; border-radius: 0.5rem; background: white; touch-action: none; }
        /* 自訂卷軸 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 鎖屏覆蓋層 */
        #lock-screen {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-gray-800">

    <!-- 登入畫面 -->
    <div id="login-view" class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2"><i class="fas fa-chalkboard-teacher mr-2"></i>EngClass Pro</h1>
            <p class="text-gray-500 mb-8">請選擇您的身分進入教室</p>
            
            <div class="space-y-4">
                <button id="btn-show-student-login" class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold text-lg transition shadow-md">
                    <i class="fas fa-user-graduate mr-2"></i> 我是學生
                </button>
                <button id="btn-show-teacher-login" class="w-full py-4 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-bold text-lg transition shadow-md">
                    <i class="fas fa-chalkboard mr-2"></i> 我是老師
                </button>
            </div>

            <!-- 學生登入表單 (預設隱藏) -->
            <div id="student-login-form" class="hidden mt-6 text-left border-t pt-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">班級</label>
                    <select id="student-grade" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="5">五年級</option>
                        <option value="6">六年級</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">座號</label>
                    <select id="student-seat" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <!-- 座號選項透過 JS 動態生成 -->
                    </select>
                </div>
                <button id="btn-student-join" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-bold transition shadow">
                    進入教室
                </button>
            </div>

            <!-- 老師登入表單 (預設隱藏) -->
            <div id="teacher-login-form" class="hidden mt-6 text-left border-t pt-6">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">教師密碼</label>
                    <input type="password" id="teacher-password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="請輸入密碼">
                </div>
                <button id="btn-teacher-join" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-bold transition shadow">
                    開啟控制台
                </button>
            </div>
        </div>
    </div>

    <!-- 教師控制台 -->
    <div id="teacher-view" class="hidden flex-1 flex h-full bg-gray-100">
        <!-- 左側工具列 -->
        <div class="w-64 bg-white border-r flex flex-col shadow-sm z-10">
            <div class="p-4 border-b bg-indigo-600 text-white flex justify-between items-center">
                <h2 class="font-bold text-lg"><i class="fas fa-cog mr-2"></i>控制台</h2>
                <span id="teacher-grade-indicator" class="px-2 py-1 bg-white/20 rounded text-xs font-bold">目前: 5年級</span>
            </div>
            
            <div class="p-3">
                <select id="control-grade-select" class="w-full p-2 bg-gray-50 border rounded-lg font-bold text-indigo-700">
                    <option value="5">切換至：五年級 (5人)</option>
                    <option value="6">切換至：六年級 (6人)</option>
                </select>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-2">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4">發布任務</div>
                <button class="t-tool-btn w-full text-left p-3 rounded-lg bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 border transition flex items-center" data-mode="ox">
                    <i class="fas fa-check-circle w-6 text-center"></i> O/X 題
                </button>
                <button class="t-tool-btn w-full text-left p-3 rounded-lg bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 border transition flex items-center" data-mode="abc">
                    <i class="fas fa-list-ul w-6 text-center"></i> 選擇題 (A~C)
                </button>
                <button class="t-tool-btn w-full text-left p-3 rounded-lg bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 border transition flex items-center" data-mode="typing">
                    <i class="fas fa-keyboard w-6 text-center"></i> 自由作答 (打字)
                </button>
                <button class="t-tool-btn w-full text-left p-3 rounded-lg bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 border transition flex items-center" data-mode="whiteboard">
                    <i class="fas fa-pen w-6 text-center"></i> 小白板 (手寫)
                </button>
                
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-6">分享與工具</div>
                <button class="t-tool-btn w-full text-left p-3 rounded-lg bg-gray-50 hover:bg-purple-50 text-gray-700 hover:text-purple-600 border transition flex items-center" data-mode="material">
                    <i class="fas fa-share-square w-6 text-center"></i> 派發圖片/教材
                </button>
                <button id="btn-lock-screen" class="w-full text-left p-3 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 transition flex items-center mt-2">
                    <i class="fas fa-lock w-6 text-center"></i> 鎖定學生螢幕
                </button>
                <button id="btn-unlock-screen" class="hidden w-full text-left p-3 rounded-lg bg-green-50 hover:bg-green-100 text-green-600 border border-green-200 transition flex items-center mt-2">
                    <i class="fas fa-unlock w-6 text-center"></i> 解除鎖定
                </button>
            </div>
            <div class="p-4 border-t">
                 <button id="btn-close-task" class="w-full py-3 bg-gray-800 hover:bg-gray-900 text-white rounded-lg font-bold transition shadow">
                    <i class="fas fa-stop-circle mr-2"></i>收回所有任務
                </button>
            </div>
        </div>

        <!-- 中間學生監控區 -->
        <div class="flex-1 flex flex-col h-full bg-gray-100 overflow-hidden">
            <!-- 頂部資訊列 -->
            <div class="bg-white p-4 border-b flex justify-between items-center shadow-sm">
                <div>
                    <h2 class="text-xl font-bold text-gray-800" id="current-task-title">目前無任務</h2>
                    <p class="text-sm text-gray-500" id="current-task-subtitle">學生畫面目前為待機狀態</p>
                </div>
                <div class="flex space-x-2">
                    <button id="btn-blind-mode" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-700 font-bold transition" title="隱藏學生的作答內容，直到老師開獎">
                        <i class="fas fa-eye-slash mr-1"></i> 盲答模式: 關
                    </button>
                    <button id="btn-show-answers" class="hidden px-4 py-2 bg-yellow-400 hover:bg-yellow-500 rounded-lg text-gray-900 font-bold transition shadow">
                        <i class="fas fa-star mr-1"></i> 一鍵開獎
                    </button>
                </div>
            </div>

            <!-- 學生卡片網格 (動態生成) -->
            <div id="teacher-students-grid" class="flex-1 p-6 overflow-y-auto grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 align-content-start">
                <!-- 透過 JS 精準更新，不整塊重繪 -->
            </div>
        </div>

        <!-- 右側紀錄與管理面板 -->
        <div class="w-72 bg-white border-l flex flex-col shadow-sm z-10">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700"><i class="fas fa-clipboard-list mr-2"></i>課堂紀錄</h2>
                <button id="btn-reset-points" class="text-xs px-2 py-1 bg-red-100 text-red-600 rounded hover:bg-red-200">歸零分數</button>
            </div>
            <div class="flex-1 overflow-y-auto p-3" id="records-container">
                <!-- 遲到與缺交紀錄會顯示在這裡 -->
                <div class="text-center text-gray-400 text-sm mt-10" id="no-records-msg">目前無任何紀錄</div>
            </div>
        </div>
    </div>

    <!-- 學生端畫面 -->
    <div id="student-view" class="hidden flex-1 flex flex-col h-full bg-blue-50 relative">
        <!-- 學生頂部狀態 -->
        <div class="bg-white p-3 border-b shadow-sm flex justify-between items-center z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-500 text-white rounded-full flex items-center justify-center font-bold text-xl" id="stu-header-seat">1</div>
                <div>
                    <div class="font-bold text-gray-800" id="stu-header-grade">五年級</div>
                    <div class="text-xs text-blue-600 font-bold"><i class="fas fa-star text-yellow-400"></i> 分數: <span id="stu-header-score">0</span></div>
                </div>
            </div>
            <div class="text-right">
                <div id="stu-task-status" class="px-3 py-1 bg-gray-200 text-gray-600 rounded-full text-sm font-bold animate-pulse">
                    等待老師派發任務...
                </div>
            </div>
        </div>

        <!-- 學生任務內容區 -->
        <div id="student-task-container" class="flex-1 p-6 flex flex-col items-center justify-center relative">
            <!-- 預設待機 -->
            <div id="stu-mode-waiting" class="text-center text-gray-400">
                <i class="fas fa-mug-hot text-6xl mb-4 text-gray-300"></i>
                <h2 class="text-2xl font-bold">準備上課囉！</h2>
                <p class="mt-2">請看老師黑板，等待任務開始</p>
            </div>

            <!-- O/X 題 -->
            <div id="stu-mode-ox" class="hidden w-full max-w-md space-y-6">
                <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">請選擇 O 或 X</h2>
                <div class="flex space-x-4">
                    <button class="stu-ans-btn flex-1 py-12 bg-white border-4 border-blue-500 rounded-2xl text-blue-500 text-6xl font-bold hover:bg-blue-50 transition shadow-lg" data-ans="O">O</button>
                    <button class="stu-ans-btn flex-1 py-12 bg-white border-4 border-red-500 rounded-2xl text-red-500 text-6xl font-bold hover:bg-red-50 transition shadow-lg" data-ans="X">X</button>
                </div>
            </div>

            <!-- 選擇題 -->
            <div id="stu-mode-abc" class="hidden w-full max-w-md space-y-4">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">請選擇正確答案</h2>
                <button class="stu-ans-btn w-full py-6 bg-white border-2 border-gray-300 rounded-xl text-2xl font-bold text-gray-700 hover:border-blue-500 hover:text-blue-500 transition shadow" data-ans="A">A</button>
                <button class="stu-ans-btn w-full py-6 bg-white border-2 border-gray-300 rounded-xl text-2xl font-bold text-gray-700 hover:border-blue-500 hover:text-blue-500 transition shadow" data-ans="B">B</button>
                <button class="stu-ans-btn w-full py-6 bg-white border-2 border-gray-300 rounded-xl text-2xl font-bold text-gray-700 hover:border-blue-500 hover:text-blue-500 transition shadow" data-ans="C">C</button>
            </div>

            <!-- 打字題 -->
            <div id="stu-mode-typing" class="hidden w-full max-w-lg flex flex-col h-full max-h-96">
                <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-keyboard mr-2"></i>請輸入答案：</h2>
                <textarea id="stu-typing-input" class="flex-1 w-full p-4 rounded-xl border-2 border-gray-300 focus:border-blue-500 outline-none resize-none text-lg shadow-inner" placeholder="在這裡輸入文字..."></textarea>
                <button id="btn-stu-submit-typing" class="mt-4 w-full py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold text-xl shadow transition">
                    送出答案
                </button>
            </div>

            <!-- 小白板 -->
            <div id="stu-mode-whiteboard" class="hidden w-full max-w-2xl flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-gray-700"><i class="fas fa-pen mr-2"></i>手寫小白板</h2>
                    <button id="btn-stu-clear-board" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-bold"><i class="fas fa-eraser mr-1"></i>清空</button>
                </div>
                <canvas id="stu-canvas" class="drawing-board w-full h-80 shadow-inner bg-white" width="600" height="320"></canvas>
                <button id="btn-stu-submit-board" class="mt-4 w-full py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold text-xl shadow transition">
                    送出白板
                </button>
            </div>
            
            <!-- 教材展示 -->
            <div id="stu-mode-material" class="hidden w-full max-w-3xl flex flex-col items-center">
                <h2 class="text-2xl font-bold text-gray-800 mb-4"><i class="fas fa-chalkboard mr-2"></i>老師分享的畫面</h2>
                <div id="stu-material-content" class="w-full bg-white p-2 rounded-xl shadow border min-h-[300px] flex items-center justify-center overflow-hidden">
                    <!-- 圖片會顯示在這裡 -->
                </div>
            </div>
        </div>
        
        <!-- 鎖屏覆蓋層 (老師啟動鎖定時顯示) -->
        <div id="lock-screen" class="hidden absolute inset-0 z-50 bg-black/60 flex flex-col items-center justify-center text-white">
            <i class="fas fa-lock text-7xl mb-6 text-red-400"></i>
            <h1 class="text-4xl font-bold tracking-wider">Eyes on Teacher!</h1>
            <p class="mt-4 text-xl opacity-90">請專心看老師，目前平板已鎖定</p>
        </div>
    </div>

    <!-- 老師用：發布任務設定 Modal -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modal-title">發布任務</h3>
                <button class="close-modal text-white/70 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <p class="text-gray-600" id="modal-desc">設定並發布任務給學生。</p>
                
                <!-- 特殊模組：教材上傳區 -->
                <div id="modal-material-upload" class="hidden space-y-4">
                    <label class="block text-sm font-medium text-gray-700">選擇要傳送的圖片</label>
                    <input type="file" id="material-file-input" accept="image/*" class="w-full p-2 border rounded">
                    <p class="text-xs text-gray-500">建議選擇較小的圖片(小於 1MB)以確保全班同步順暢。</p>
                </div>

            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end space-x-2">
                <button class="close-modal px-4 py-2 bg-gray-200 rounded-lg font-bold text-gray-700">取消</button>
                <button id="btn-confirm-task" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold shadow">確認發布</button>
            </div>
        </div>
    </div>


    <script type="module">
        // ----------------------------------------------------------------------
        // 1. Firebase 初始化設定 (使用您提供的 nypscm 金鑰)
        // ----------------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, addDoc, query, orderBy, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 使用您提供的真實資料庫金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyAdKdGniXt6PbHFfxIjyY09bWplPQQufc4",
            authDomain: "nypscm.firebaseapp.com",
            projectId: "nypscm",
            storageBucket: "nypscm.firebasestorage.app",
            messagingSenderId: "775913301411",
            appId: "1:775913301411:web:9d73da7688854865826616"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        // 使用固定的 appID 以確保資料存放路徑一致
        const globalAppId = "nypscm-class-pro"; 

        // ----------------------------------------------------------------------
        // 2. 狀態與變數管理
        // ----------------------------------------------------------------------
        const STATE = {
            role: null, // 'teacher' 或 'student'
            grade: '5', // 預設 5 年級
            seat: null,
            userId: null,
            
            // 老師專用狀態
            isBlindMode: false,
            showAnswersTriggered: false,
            tempMaterialBase64: null,
            
            // 資料快取 (用於精準更新 DOM)
            localStudentsData: {}, 
            
            // Firebase 監聽器取消函數
            unsubState: null,
            unsubStudents: null,
            unsubRecords: null
        };

        const CLASS_SIZES = { '5': 5, '6': 6 };

        // ----------------------------------------------------------------------
        // 3. 核心工具函數
        // ----------------------------------------------------------------------
        
        // 取得資料庫路徑 (嚴格遵守規則)
        const getPublicPath = (collectionName) => collection(db, 'artifacts', globalAppId, 'public', 'data', collectionName);
        const getDocPath = (collectionName, docId) => doc(db, 'artifacts', globalAppId, 'public', 'data', collectionName, docId);

        // 登入驗證
        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
                return new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            STATE.userId = user.uid;
                            resolve(user);
                        }
                    });
                });
            } catch (error) {
                alert("無法連線至伺服器，請檢查網路。");
                console.error(error);
            }
        };

        // 產生座號下拉選單
        const populateSeats = () => {
            const grade = document.getElementById('student-grade').value;
            const seatSelect = document.getElementById('student-seat');
            seatSelect.innerHTML = '';
            for(let i=1; i<=CLASS_SIZES[grade]; i++){
                seatSelect.innerHTML += `<option value="${i}">${i} 號</option>`;
            }
        };

        // 觸發彩帶特效
        const fireConfetti = () => {
            if(window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        };

        // ----------------------------------------------------------------------
        // 4. 教師端邏輯 (精準 DOM 更新與事件委派)
        // ----------------------------------------------------------------------

        // 初始化老師畫面 (建立學生的格子，之後只更新內容不重建)
        const initTeacherGrid = () => {
            const grid = document.getElementById('teacher-students-grid');
            grid.innerHTML = ''; // 清空
            const size = CLASS_SIZES[STATE.grade];
            
            for(let i = 1; i <= size; i++) {
                const stuId = `${STATE.grade}-${i}`;
                const cardHtml = `
                    <div id="card-${stuId}" class="student-card bg-white rounded-xl shadow-sm border p-4 flex flex-col relative overflow-hidden">
                        <div class="flex justify-between items-start mb-3 border-b pb-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center">${i}</div>
                                <span class="font-bold text-gray-700">座號 ${i}</span>
                            </div>
                            <div class="text-yellow-500 font-bold text-lg"><i class="fas fa-star mr-1"></i><span id="score-${stuId}">0</span></div>
                        </div>
                        
                        <div class="flex-1 flex flex-col justify-center items-center py-4 bg-gray-50 rounded-lg mb-3 min-h-[100px]">
                            <!-- 狀態圖示與作答內容 -->
                            <div id="status-icon-${stuId}" class="text-4xl text-gray-300 mb-2"><i class="fas fa-minus-circle"></i></div>
                            <div id="answer-content-${stuId}" class="text-xl font-bold text-gray-800 text-center w-full px-2 break-words">未作答</div>
                        </div>

                        <div class="flex justify-between mt-auto space-x-1">
                            <button class="action-btn flex-1 py-1.5 bg-green-100 hover:bg-green-200 text-green-700 rounded font-bold text-sm" data-action="addScore" data-stuid="${stuId}">
                                +1 分
                            </button>
                            <button class="action-btn flex-1 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 rounded font-bold text-sm" data-action="addLate" data-grade="${STATE.grade}" data-seat="${i}">
                                遲到
                            </button>
                            <button class="action-btn flex-1 py-1.5 bg-orange-100 hover:bg-orange-200 text-orange-700 rounded font-bold text-sm" data-action="addHW" data-grade="${STATE.grade}" data-seat="${i}">
                                沒交
                            </button>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            }
        };

        // 老師切換班級
        const switchTeacherGrade = (newGrade) => {
            STATE.grade = newGrade;
            document.getElementById('teacher-grade-indicator').innerText = `目前: ${newGrade}年級`;
            initTeacherGrid();
            startTeacherListeners();
        };

        // 精準更新單一學生的卡片 UI
        const patchStudentCard = (stuId, data, currentMode) => {
            const { score = 0, status = 'waiting', answer = '' } = data;
            
            // 更新分數
            document.getElementById(`score-${stuId}`).innerText = score;
            
            const iconEl = document.getElementById(`status-icon-${stuId}`);
            const ansEl = document.getElementById(`answer-content-${stuId}`);
            const cardEl = document.getElementById(`card-${stuId}`);

            // 判斷是否要遮蔽答案 (盲答模式)
            const shouldHideAnswer = STATE.isBlindMode && !STATE.showAnswersTriggered && status === 'submitted';

            if (status === 'submitted') {
                cardEl.classList.add('border-green-400', 'bg-green-50/30');
                cardEl.classList.remove('border-gray-200');
                
                if (shouldHideAnswer) {
                    iconEl.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                    ansEl.innerHTML = '<span class="text-green-600">已作答</span>';
                } else {
                    // 顯示真實答案
                    if (currentMode === 'whiteboard' && answer.startsWith('data:image')) {
                        iconEl.innerHTML = '';
                        ansEl.innerHTML = `<img src="${answer}" class="max-h-24 object-contain border rounded bg-white">`;
                    } else if (currentMode === 'typing') {
                        iconEl.innerHTML = '';
                        ansEl.innerHTML = `<div class="text-sm text-left w-full max-h-24 overflow-y-auto">${answer}</div>`;
                    } else {
                        iconEl.innerHTML = '';
                        ansEl.innerHTML = `<span class="text-blue-600 text-3xl">${answer}</span>`;
                    }
                }
            } else if (status === 'thinking') {
                 cardEl.classList.remove('border-green-400', 'bg-green-50/30');
                 iconEl.innerHTML = '<i class="fas fa-pencil-alt text-yellow-500 animate-bounce"></i>';
                 ansEl.innerHTML = '<span class="text-yellow-600">作答中...</span>';
            } else { // waiting
                 cardEl.classList.remove('border-green-400', 'bg-green-50/30');
                 iconEl.innerHTML = '<i class="fas fa-minus-circle text-gray-300"></i>';
                 ansEl.innerHTML = '等待中';
            }
        };

        // 啟動老師的資料監聽
        const startTeacherListeners = () => {
            // 清理舊監聽
            if(STATE.unsubState) STATE.unsubState();
            if(STATE.unsubStudents) STATE.unsubStudents();
            if(STATE.unsubRecords) STATE.unsubRecords();

            // 1. 監聽全班狀態
            STATE.unsubState = onSnapshot(getDocPath(`classState_${STATE.grade}`, 'current'), (docSnap) => {
                const data = docSnap.exists() ? docSnap.data() : { mode: 'waiting', locked: false };
                
                // 更新標題列
                const titleEl = document.getElementById('current-task-title');
                const subTitleEl = document.getElementById('current-task-subtitle');
                const modes = { 'ox': 'O/X 題', 'abc': '選擇題', 'typing': '自由作答', 'whiteboard': '小白板', 'material': '分享教材' };
                
                if(data.mode === 'waiting') {
                    titleEl.innerText = '目前無任務';
                    subTitleEl.innerText = data.locked ? '🔒 學生螢幕已鎖定' : '學生畫面目前為待機狀態';
                } else {
                    titleEl.innerText = `進行中：${modes[data.mode] || '未知任務'}`;
                    subTitleEl.innerText = '學生作答中...';
                }

                // 鎖屏按鈕切換
                if(data.locked) {
                    document.getElementById('btn-lock-screen').classList.add('hidden');
                    document.getElementById('btn-unlock-screen').classList.remove('hidden');
                } else {
                    document.getElementById('btn-lock-screen').classList.remove('hidden');
                    document.getElementById('btn-unlock-screen').classList.add('hidden');
                }

                // 更新所有學生卡片 UI (因為可能牽涉到盲答解開或模式改變)
                Object.keys(STATE.localStudentsData).forEach(stuId => {
                    patchStudentCard(stuId, STATE.localStudentsData[stuId], data.mode);
                });
            }, (error) => console.error(error));

            // 2. 監聽學生個人資料 (分數與答案)
            STATE.unsubStudents = onSnapshot(collection(db, 'artifacts', globalAppId, 'public', 'data', `students_${STATE.grade}`), (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    const stuId = change.doc.id; // e.g. "5-1"
                    const data = change.doc.data();
                    STATE.localStudentsData[stuId] = data; // 更新本機快取
                    
                    // 取得當前模式
                    getDoc(getDocPath(`classState_${STATE.grade}`, 'current')).then(sDoc => {
                        const currentMode = sDoc.exists() ? sDoc.data().mode : 'waiting';
                        patchStudentCard(stuId, data, currentMode);
                    });
                });
            }, (error) => console.error(error));

            // 3. 監聽獎懲紀錄
            STATE.unsubRecords = onSnapshot(collection(db, 'artifacts', globalAppId, 'public', 'data', `records_${STATE.grade}`), (snapshot) => {
                const container = document.getElementById('records-container');
                const noMsg = document.getElementById('no-records-msg');
                
                // 先收集所有紀錄並排序
                let records = [];
                snapshot.forEach(doc => {
                    records.push({ id: doc.id, ...doc.data() });
                });
                
                // 依時間反向排序 (新的在上)
                records.sort((a, b) => b.timestamp - a.timestamp);
                
                if(records.length === 0) {
                    container.innerHTML = '';
                    container.appendChild(noMsg);
                    noMsg.style.display = 'block';
                } else {
                    container.innerHTML = '';
                    records.forEach(record => {
                        const typeText = record.type === 'late' ? '<span class="text-red-500">遲到</span>' : '<span class="text-orange-500">沒交作業</span>';
                        const timeString = new Date(record.timestamp).toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'});
                        
                        const el = document.createElement('div');
                        el.className = 'p-2 mb-2 bg-white border rounded shadow-sm flex justify-between items-center text-sm';
                        el.innerHTML = `
                            <div>
                                <span class="font-bold text-gray-700">${record.seat}號</span> 
                                ${typeText} <span class="text-gray-400 text-xs ml-1">${timeString}</span>
                            </div>
                            <button class="text-gray-400 hover:text-red-500 delete-record-btn" data-id="${record.id}">
                                <i class="fas fa-times"></i>
                            </button>
                        `;
                        container.appendChild(el);
                    });
                }
            }, (error) => console.error(error));
        };

        // 事件委派：處理所有老師端卡片上與動態生成的按鈕點擊
        document.addEventListener('click', async (e) => {
            if (STATE.role !== 'teacher') return;

            const target = e.target.closest('button');
            if (!target) return;

            // 處理加分、遲到、沒交
            if (target.classList.contains('action-btn')) {
                const action = target.dataset.action;
                const seat = target.dataset.seat;
                
                if (action === 'addScore') {
                    const stuId = target.dataset.stuid;
                    const docRef = getDocPath(`students_${STATE.grade}`, stuId);
                    const docSnap = await getDoc(docRef);
                    const currentScore = docSnap.exists() ? (docSnap.data().score || 0) : 0;
                    await setDoc(docRef, { score: currentScore + 1 }, { merge: true });
                    
                    // 特效
                    const btn = target;
                    const orgText = btn.innerText;
                    btn.innerText = "已加分!";
                    btn.classList.add('bg-green-500', 'text-white');
                    setTimeout(() => {
                        btn.innerText = orgText;
                        btn.classList.remove('bg-green-500', 'text-white');
                    }, 1000);
                }
                
                if (action === 'addLate' || action === 'addHW') {
                    const type = action === 'addLate' ? 'late' : 'hw';
                    await addDoc(collection(db, 'artifacts', globalAppId, 'public', 'data', `records_${STATE.grade}`), {
                        grade: STATE.grade,
                        seat: seat,
                        type: type,
                        timestamp: Date.now()
                    });
                }
            }

            // 處理刪除紀錄
            if (target.classList.contains('delete-record-btn')) {
                const id = target.dataset.id;
                await deleteDoc(getDocPath(`records_${STATE.grade}`, id));
            }
        });


        // ----------------------------------------------------------------------
        // 5. 學生端邏輯
        // ----------------------------------------------------------------------

        // 學生送出答案
        const submitStudentAnswer = async (answer) => {
            const stuId = `${STATE.grade}-${STATE.seat}`;
            await setDoc(getDocPath(`students_${STATE.grade}`, stuId), {
                status: 'submitted',
                answer: answer
            }, { merge: true });
            
            document.getElementById('stu-task-status').innerText = "已送出！(可修改重送)";
            document.getElementById('stu-task-status').className = "px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-bold";
            fireConfetti();
        };

        // 啟動學生資料監聽
        const startStudentListeners = () => {
            const stuId = `${STATE.grade}-${STATE.seat}`;

            // 監聽自己的分數
            onSnapshot(getDocPath(`students_${STATE.grade}`, stuId), (docSnap) => {
                if(docSnap.exists()){
                    const data = docSnap.data();
                    document.getElementById('stu-header-score').innerText = data.score || 0;
                }
            }, (err) => console.error(err));

            // 監聽全班狀態 (任務改變、鎖屏)
            onSnapshot(getDocPath(`classState_${STATE.grade}`, 'current'), (docSnap) => {
                const data = docSnap.exists() ? docSnap.data() : { mode: 'waiting', locked: false };
                
                // 處理鎖屏
                if(data.locked) {
                    document.getElementById('lock-screen').classList.remove('hidden');
                } else {
                    document.getElementById('lock-screen').classList.add('hidden');
                }

                // 處理模式切換
                const modes = ['waiting', 'ox', 'abc', 'typing', 'whiteboard', 'material'];
                modes.forEach(m => {
                    document.getElementById(`stu-mode-${m}`).classList.add('hidden');
                });
                
                if (data.mode && document.getElementById(`stu-mode-${data.mode}`)) {
                    document.getElementById(`stu-mode-${data.mode}`).classList.remove('hidden');
                } else {
                    document.getElementById('stu-mode-waiting').classList.remove('hidden');
                }

                // 更新狀態列提示
                const statusEl = document.getElementById('stu-task-status');
                if(data.mode === 'waiting') {
                    statusEl.innerText = "等待任務...";
                    statusEl.className = "px-3 py-1 bg-gray-200 text-gray-600 rounded-full text-sm font-bold animate-pulse";
                    
                    // 老師關閉任務時，重置學生自己的狀態為 waiting
                    setDoc(getDocPath(`students_${STATE.grade}`, stuId), { status: 'waiting', answer: '' }, { merge: true });
                } else {
                    statusEl.innerText = "作答中...";
                    statusEl.className = "px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm font-bold";
                    // 標記為正在思考
                    setDoc(getDocPath(`students_${STATE.grade}`, stuId), { status: 'thinking' }, { merge: true });
                }

                // 處理教材顯示
                if (data.mode === 'material' && data.materialData) {
                    const container = document.getElementById('stu-material-content');
                    container.innerHTML = `<img src="${data.materialData}" class="max-w-full h-auto max-h-[60vh] rounded shadow">`;
                }
                
                // 清空文字框與畫布
                if (data.mode !== 'typing') document.getElementById('stu-typing-input').value = '';
                if (data.mode !== 'whiteboard') clearCanvas();

            }, (err) => console.error(err));
        };


        // ----------------------------------------------------------------------
        // 6. UI 事件綁定與初始化
        // ----------------------------------------------------------------------
        
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 登入介面切換 ---
            document.getElementById('student-grade').addEventListener('change', populateSeats);
            
            document.getElementById('btn-show-student-login').addEventListener('click', () => {
                document.getElementById('student-login-form').classList.remove('hidden');
                document.getElementById('teacher-login-form').classList.add('hidden');
                populateSeats();
            });

            document.getElementById('btn-show-teacher-login').addEventListener('click', () => {
                document.getElementById('teacher-login-form').classList.remove('hidden');
                document.getElementById('student-login-form').classList.add('hidden');
            });

            // --- 學生進入教室 ---
            document.getElementById('btn-student-join').addEventListener('click', async () => {
                STATE.role = 'student';
                STATE.grade = document.getElementById('student-grade').value;
                STATE.seat = document.getElementById('student-seat').value;
                
                document.getElementById('btn-student-join').innerText = '連線中...';
                await initAuth();
                
                // 確保學生文件存在
                const stuRef = getDocPath(`students_${STATE.grade}`, `${STATE.grade}-${STATE.seat}`);
                const snap = await getDoc(stuRef);
                if(!snap.exists()) {
                    await setDoc(stuRef, { grade: STATE.grade, seat: STATE.seat, score: 0, status: 'waiting' });
                }

                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('student-view').classList.remove('hidden');
                
                document.getElementById('stu-header-grade').innerText = `${STATE.grade}年級`;
                document.getElementById('stu-header-seat').innerText = STATE.seat;
                
                initCanvas(); // 初始化畫布
                startStudentListeners();
            });

            // --- 老師進入教室 ---
            document.getElementById('btn-teacher-join').addEventListener('click', async () => {
                const pwd = document.getElementById('teacher-password').value;
                if(pwd !== 'edu') {
                    alert('密碼錯誤！');
                    return;
                }
                STATE.role = 'teacher';
                document.getElementById('btn-teacher-join').innerText = '連線中...';
                
                await initAuth();
                
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('teacher-view').classList.remove('hidden');
                
                switchTeacherGrade(STATE.grade);
            });

            // 老師切換班級選單
            document.getElementById('control-grade-select').addEventListener('change', (e) => {
                switchTeacherGrade(e.target.value);
            });

            // --- 老師發布任務 (Modal 控制) ---
            let selectedMode = null;
            document.querySelectorAll('.t-tool-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedMode = btn.dataset.mode;
                    const modes = { 'ox': 'O/X 題', 'abc': '選擇題', 'typing': '自由作答', 'whiteboard': '小白板', 'material': '分享教材' };
                    document.getElementById('modal-title').innerText = `發布：${modes[selectedMode]}`;
                    
                    if(selectedMode === 'material') {
                        document.getElementById('modal-material-upload').classList.remove('hidden');
                        document.getElementById('modal-desc').innerText = '請上傳圖片教材讓學生觀看。';
                    } else {
                        document.getElementById('modal-material-upload').classList.add('hidden');
                        document.getElementById('modal-desc').innerText = '確認後，所有學生的畫面將切換至此任務。';
                    }
                    
                    document.getElementById('task-modal').classList.remove('hidden');
                });
            });

            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('task-modal').classList.add('hidden');
                    STATE.tempMaterialBase64 = null;
                });
            });

            // 處理圖片選擇轉換為 Base64
            document.getElementById('material-file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    if(file.size > 1024 * 1024) { // 限制 1MB
                        alert("圖片超過 1MB，為確保連線順暢，請選擇較小的圖片。");
                        e.target.value = "";
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (evt) => { STATE.tempMaterialBase64 = evt.target.result; };
                    reader.readAsDataURL(file);
                }
            });

            // 確認發布任務寫入資料庫
            document.getElementById('btn-confirm-task').addEventListener('click', async () => {
                if(selectedMode === 'material' && !STATE.tempMaterialBase64) {
                    alert('請先選擇圖片！');
                    return;
                }
                
                STATE.showAnswersTriggered = false; // 重置開獎狀態
                
                const updateData = { mode: selectedMode, locked: false, timestamp: Date.now() };
                if (selectedMode === 'material') updateData.materialData = STATE.tempMaterialBase64;
                
                await setDoc(getDocPath(`classState_${STATE.grade}`, 'current'), updateData, { merge: true });
                document.getElementById('task-modal').classList.add('hidden');
                STATE.tempMaterialBase64 = null;
            });

            // --- 老師關閉任務 / 鎖定 ---
            document.getElementById('btn-close-task').addEventListener('click', async () => {
                await setDoc(getDocPath(`classState_${STATE.grade}`, 'current'), { mode: 'waiting', materialData: null }, { merge: true });
            });

            document.getElementById('btn-lock-screen').addEventListener('click', async () => {
                await setDoc(getDocPath(`classState_${STATE.grade}`, 'current'), { locked: true }, { merge: true });
            });
            document.getElementById('btn-unlock-screen').addEventListener('click', async () => {
                await setDoc(getDocPath(`classState_${STATE.grade}`, 'current'), { locked: false }, { merge: true });
            });

            // 盲答與開獎按鈕
            document.getElementById('btn-blind-mode').addEventListener('click', (e) => {
                STATE.isBlindMode = !STATE.isBlindMode;
                const btn = e.target.closest('button');
                if(STATE.isBlindMode) {
                    btn.innerHTML = '<i class="fas fa-eye-slash mr-1"></i> 盲答模式: 開';
                    btn.classList.replace('bg-gray-200', 'bg-blue-600');
                    btn.classList.replace('text-gray-700', 'text-white');
                    document.getElementById('btn-show-answers').classList.remove('hidden');
                } else {
                    btn.innerHTML = '<i class="fas fa-eye-slash mr-1"></i> 盲答模式: 關';
                    btn.classList.replace('bg-blue-600', 'bg-gray-200');
                    btn.classList.replace('text-white', 'text-gray-700');
                    document.getElementById('btn-show-answers').classList.add('hidden');
                }
                STATE.showAnswersTriggered = false;
                // 強制觸發 UI 更新
                Object.keys(STATE.localStudentsData).forEach(stuId => {
                     getDoc(getDocPath(`classState_${STATE.grade}`, 'current')).then(sDoc => {
                        patchStudentCard(stuId, STATE.localStudentsData[stuId], sDoc.exists() ? sDoc.data().mode : 'waiting');
                     });
                });
            });

            document.getElementById('btn-show-answers').addEventListener('click', () => {
                STATE.showAnswersTriggered = true;
                 Object.keys(STATE.localStudentsData).forEach(stuId => {
                     getDoc(getDocPath(`classState_${STATE.grade}`, 'current')).then(sDoc => {
                        patchStudentCard(stuId, STATE.localStudentsData[stuId], sDoc.exists() ? sDoc.data().mode : 'waiting');
                     });
                });
            });

            // 分數歸零
            document.getElementById('btn-reset-points').addEventListener('click', async () => {
                if(confirm(`確定要將 ${STATE.grade} 年級全班分數歸零嗎？`)) {
                    const snapshot = await getDocs(collection(db, 'artifacts', globalAppId, 'public', 'data', `students_${STATE.grade}`));
                    const batch = writeBatch(db);
                    snapshot.docs.forEach((d) => {
                        batch.update(d.ref, { score: 0 });
                    });
                    await batch.commit();
                }
            });

            // --- 學生作答事件 ---
            document.querySelectorAll('.stu-ans-btn').forEach(btn => {
                btn.addEventListener('click', () => submitStudentAnswer(btn.dataset.ans));
            });

            document.getElementById('btn-stu-submit-typing').addEventListener('click', () => {
                const val = document.getElementById('stu-typing-input').value.trim();
                if(val) submitStudentAnswer(val);
            });

            document.getElementById('btn-stu-submit-board').addEventListener('click', () => {
                const canvas = document.getElementById('stu-canvas');
                submitStudentAnswer(canvas.toDataURL('image/png'));
            });
            
            document.getElementById('btn-stu-clear-board').addEventListener('click', clearCanvas);
        });

        // ----------------------------------------------------------------------
        // 7. 學生小白板 (Canvas) 繪圖邏輯
        // ----------------------------------------------------------------------
        let ctx, isDrawing = false, lastX = 0, lastY = 0;
        
        function initCanvas() {
            const canvas = document.getElementById('stu-canvas');
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2563eb';

            // 支援滑鼠與觸控
            const startDraw = (e) => {
                isDrawing = true;
                const pos = getPos(e);
                [lastX, lastY] = [pos.x, pos.y];
            };
            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault(); // 防止滾動
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                [lastX, lastY] = [pos.x, pos.y];
            };
            const endDraw = () => isDrawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseout', endDraw);

            canvas.addEventListener('touchstart', startDraw, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', endDraw);
            
            clearCanvas();
        }

        function clearCanvas() {
            if(!ctx) return;
            const canvas = document.getElementById('stu-canvas');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
