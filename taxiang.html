<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>他鄉的第一年</title>
<style id="gs"></style>
<style>
/* 版面：左邊是像素場景加對白紙卡，右邊是一支手機；窄螢幕時上下堆疊。整頁顏色跟著「歸屬感」從冷藍變暖橘。 */
:root{
  color-scheme:dark;
  --ink:#131a28; --shade:#2a3a55; --mid:#4f678c; --light:#8ea4c0; --paper:#dbe3ee; --glow:#ffd166;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --t-s:15px; --t-m:clamp(18px,2.1vw,23px); --t-l:clamp(34px,7vw,68px);
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:var(--t-m);line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
body.big{--t-m:clamp(22px,2.7vw,30px)}
#app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:var(--t-s)}
.bar b{letter-spacing:.2em}
.dots{display:flex;gap:6px;align-items:center;margin-right:auto}
.dots i{width:12px;height:12px;background:var(--shade);display:block}
.dots i.on{background:var(--glow)}
.dots span{margin-left:8px;color:var(--light)}
.sm{background:none;border:2px solid var(--mid);padding:2px 12px;font-size:var(--t-s);color:var(--paper)}
.sm:hover{background:var(--shade)}

/* 首頁 */
#home h1{font-size:var(--t-l);line-height:1.15;margin:.3em 0 .2em;letter-spacing:.08em;font-weight:900;text-wrap:balance}
#home h1 .g{background:var(--light)}
#home .lead{max-width:34em;margin:0 0 1.2em;color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{text-align:left;background:var(--paper);color:var(--ink);border:0;padding:16px 18px 18px;box-shadow:6px 6px 0 var(--shade);display:flex;flex-direction:column;gap:6px}
.card:hover{box-shadow:6px 6px 0 var(--glow)}
.card .tag{align-self:flex-start;background:var(--ink);color:var(--paper);font-size:var(--t-s);padding:1px 10px;letter-spacing:.08em}
.card strong{font-size:1.5em;line-height:1.2}
.card span{font-size:.85em;line-height:1.5}
.note{font-size:var(--t-s);color:var(--light);margin:1.2em 0 0}

/* 遊戲 */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,310px);gap:16px;align-items:stretch}
.world{display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{position:relative;container-type:inline-size;border:4px solid var(--shade);background:var(--shade)}
.scene canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.sign{position:absolute;transform:translate(-50%,-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  padding:0 .45em;font-size:clamp(10px,2.5cqw,24px);font-weight:700;white-space:nowrap;line-height:1.5}
.box{background:var(--paper);color:var(--ink);padding:16px 20px 18px;min-height:9.5em;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--shade)}
.who{align-self:flex-start;background:var(--ink);color:var(--paper);font-size:var(--t-s);padding:1px 10px;letter-spacing:.06em}
.who em{font-style:normal;color:var(--glow);margin-left:.5em}
.txt{margin:0;min-height:3.3em;max-width:38em}
.learned{margin:0;font-size:var(--t-s);font-weight:700;border-left:6px solid var(--ink);padding-left:10px}
.doc{background:var(--ink);color:var(--paper);padding:10px 16px;font-size:.9em;line-height:1.8}
.doc h3{margin:0 0 4px;font-size:var(--t-s);letter-spacing:.2em;color:var(--light);font-weight:700}
.doc p{margin:0;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.opt{text-align:left;background:transparent;border:3px solid var(--ink);padding:8px 14px;color:var(--ink);line-height:1.45}
.opt:hover{background:var(--glow)}
.next{align-self:flex-end;background:var(--ink);color:var(--paper);border:0;padding:6px 22px;letter-spacing:.15em}
.next:hover{background:var(--shade)}

#game:empty{display:none}
.ov{position:absolute;inset:0;background:var(--ink);padding:3cqw;overflow:auto;display:grid;align-content:center;gap:3cqw}
.ov.quiz{grid-template-columns:1fr 2fr;align-items:center}
.grid{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:2cqw}
.tile{background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:1.2cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;
  font-size:clamp(11px,2.5cqw,22px);font-weight:700;line-height:1.35;min-height:13cqw}
.tile:hover:not(:disabled){background:var(--light)}
.tile.no{opacity:.3}
.tile.yes{background:var(--glow);opacity:1}
.tile .w{font-size:1.6em;letter-spacing:.1em}
.tile .m{display:flex;align-items:center;gap:.6em}
.ico{image-rendering:pixelated;image-rendering:crisp-edges;width:clamp(30px,8cqw,72px);aspect-ratio:1}
.q{display:flex;flex-direction:column;align-items:center;gap:1cqw;color:var(--paper);font-size:clamp(12px,2.6cqw,24px);font-weight:700;text-align:center}
.q .ico{width:clamp(48px,15cqw,130px)}
.tgt{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:3px solid var(--ink);padding:4px;line-height:0;
  box-shadow:0 0 0 0 var(--glow);animation:life var(--life) linear}
.tgt .ico{width:clamp(34px,9cqw,84px)}
@keyframes life{from{box-shadow:0 0 0 10px var(--glow)}to{box-shadow:0 0 0 0 var(--glow)}}
#game.lamp{box-shadow:inset 0 0 0 8px var(--glow)}
#game.lamp .tgt{opacity:.55}
.shake{animation:shake .3s}
@keyframes shake{25%{margin-left:-6px}75%{margin-left:6px}}
#end a{color:inherit;font-weight:700;display:inline-block;margin-top:4px}
.g{display:inline-block;width:.86em;height:.86em;margin:0 .07em;vertical-align:-.08em;background:currentColor;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.lit{font-weight:900;animation:lit 1.6s ease-out}
@keyframes lit{from{background:var(--glow)}to{background:transparent}}

.phone{background:var(--shade);border:4px solid var(--mid);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:78vh;font-size:.82em;line-height:1.5}
.phone h2{margin:0;font-size:var(--t-s);letter-spacing:.2em;color:var(--light);text-align:center;font-weight:700}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:120px}
.bub{background:var(--paper);color:var(--ink);padding:7px 11px;max-width:92%;align-self:flex-start}
.bub.me{background:var(--glow);align-self:flex-end}
.bub small{display:block;font-size:12px;letter-spacing:.1em;opacity:.7}
.seen{margin:0;font-size:13px;color:var(--light);text-align:right}
#reply{display:flex;flex-direction:column;gap:6px}
#reply .opt{border-color:var(--paper);color:var(--paper)}
#reply .opt:hover{background:var(--glow);color:var(--ink);border-color:var(--glow)}
#reply p{margin:0;font-size:13px;color:var(--glow);letter-spacing:.1em}

/* 結尾 */
#end{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 28px}
#end h1{grid-column:1/-1;font-size:clamp(26px,4.4vw,44px);line-height:1.25;margin:.2em 0 0;text-wrap:balance}
#end .ep{grid-column:1/-1;margin:0;max-width:36em}
#end h2{font-size:var(--t-s);letter-spacing:.2em;color:var(--glow);margin:0 0 8px}
#end ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
#end li{background:var(--paper);color:var(--ink);padding:10px 14px;font-size:.88em;line-height:1.5}
#end li small{display:block;font-size:13px;letter-spacing:.08em;opacity:.75}
#end .ask li{background:none;color:var(--paper);border-left:6px solid var(--glow);padding:2px 0 2px 14px}
#end .wide{grid-column:1/-1}
#end .wide ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));align-items:start}
#end .hint{margin:0 0 10px;font-size:var(--t-s);color:var(--light)}
#end .fx{margin:8px 0 0;padding-top:8px;border-top:2px solid var(--ink);font-size:.94em}
#end .back{grid-column:1/-1;justify-self:start}

/* 教師面板 */
#teacher{background:var(--shade);border:4px solid var(--glow);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:var(--t-s)}
#teacher label{display:flex;gap:6px;align-items:center}
#teacher select{font:inherit;background:var(--ink);color:var(--paper);border:2px solid var(--mid);padding:2px 6px}
#teacher p{flex-basis:100%;margin:0;color:var(--light)}

@media (max-width:760px){.play{grid-template-columns:1fr}.phone{max-height:340px}}
@media (prefers-reduced-motion:reduce){.lit{animation:none}}
</style>

</head>
<body>
<div id="app">
  <div class="bar">
    <b>他鄉的第一年</b>
    <div class="dots" id="dots" hidden></div>
    <button class="sm" id="bSnd" type="button">聲音：開</button>
    <button class="sm" id="bT" type="button">老師</button>
  </div>

  <div id="teacher" hidden>
    <label>角色 <select id="tChar"></select></label>
    <label>從這一段開始 <select id="tStage"></select></label>
    <button class="sm" id="tGo" type="button">開始</button>
    <button class="sm" id="tBig" type="button">投影模式：關</button>
    <button class="sm" id="tHome" type="button">回首頁</button>
    <p>每個角色最多 2 位學生。平板之間不會連線，請在開始前現場分配。</p>
  </div>

  <section id="home">
    <h1 id="ttl" aria-label="他鄉的第一年"></h1>
    <p class="lead">接下來，你會搬到一個看不懂字的地方，生活一年。看不懂的字會變成奇怪的符號，慢慢學會以後，它們會變回來。請戴上耳機，選一個人。</p>
    <div class="cards" id="cards"></div>
    <p class="note">故事裡的人物是虛構的，參考了多篇真實報導寫成。玩完以後，你會看到那些報導。</p>
  </section>

  <section id="play" class="play" hidden>
    <div class="world">
      <div class="scene"><canvas id="cv" width="320" height="180" role="img" aria-label="遊戲場景"></canvas><div id="signs"></div><div id="game"></div></div>
      <div class="box">
        <span class="who" id="who" hidden></span>
        <p class="learned" id="learned" hidden></p>
        <div class="doc" id="doc" hidden></div>
        <p class="txt" id="txt"></p>
        <div class="acts" id="acts"></div>
      </div>
    </div>
    <aside class="phone" aria-label="手機">
      <h2 id="phT">訊息</h2>
      <div id="log"></div>
      <div id="reply"></div>
    </aside>
  </section>

  <section id="end" hidden></section>
</div>

<script>

 end:{ep:'幾年後，阿蓮在小宇的學校當通譯志工，幫剛來台灣的媽媽看懂聯絡簿。',

 [{s:'store',w:.15,signs:[{x:14,y:16,t:'尿布特價 399 元'},{x:44,y:16,t:'熱食'},{x:83,y:30,t:'收銀台'},{x:52,y:92,t:'請排隊'}],x:'來台灣快一年了。兒子小宇剛滿月。今天阿明上班，我自己出門買尿布。'},

    {l:'拿出手機，用翻譯 App',e:'花的時間最多，也最容易被後面的人催。可是只有這樣，才真的知道對方在問什麼。',then:[{x:'我打開翻譯 App，請他再說一次。手一直抖，按了好幾次才按對。'}]}]}},

  {x:'晚上，媽媽傳訊息來。',m:{from:'媽媽',x:'今天有出門走走嗎？'},r:['有，我自己去買東西了。這裡的店很亮、很乾淨。','有。只是我看不懂字，有一點緊張。']}],

adi:{name:'阿迪',tag:'移工',from:'印尼',role:'到台灣的工廠工作，合約三年',good:'會修機器，是足球隊前鋒',init:'一二三元人工',

 [{s:'home',f:{v:'rice'},w:1,x:'這裡是印尼中爪哇的村子。清晨有喚拜的聲音，田裡的霧還沒散。'},
  {x:'我叫阿迪，24 歲。村裡誰家的摩托車壞了，都來找我修。'},
  {x:'我也是村裡足球隊的前鋒，背號 9 號。'},

  {c:{k:'第一天看不懂機器上的警告',q:'機器上貼著兩張標籤，旁邊的燈一閃一閃。我要怎麼辦？',o:[

  {f:{},x:'開始工作。箱子送到的時候，點它，把蓋子壓好。畫面邊框亮起來，就是燈亮了，千萬不要碰。',play:{t:'rush',k:'工廠第一天',e:'燈亮的時候伸手，在真的工廠裡可能會受傷。看不懂警告標示，等於每天都在冒險。',icons:['📦'],n:8,life:3200,gap:1500,lamp:[1400,2200],at:[[36,62],[45,62],[54,62],[62,62]],

  {x:'仲介傳來訊息。我看不懂字，只看得懂數字。數字讓我睡不著。',m:{from:'仲介',g:'tw',x:'本月服務費 1,800 元將從薪水扣除，另有貸款 9,000 元。'}}],
 [{s:'dorm',w:.25,x:'第一個月的薪水單。上面的字我都看不懂，可是每一行都有一個減號。',d:{t:'薪資單',l:['本月薪資　29,500','膳宿費　－3,000','仲介服務費　－1,800','勞保健保　－1,100','貸款還款　－9,000','實領　14,600']}},
  {d:{t:'薪資單',l:['本月薪資　29,500','膳宿費　－3,000','仲介服務費　－1,800','勞保健保　－1,100','貸款還款　－9,000','實領　14,600']},c:{k:'薪水只剩 14,600 元',q:'還剩 14,600 元。我要寄多少回家？',o:[

    {l:'搖搖手，指指天上的太陽',e:'比手勢有時候說不清楚。對方不認識齋戒月，就猜不到意思。',then:[{x:'同事看看天空，又看看我，一臉問號。他聳聳肩，走了。'}]},

  {x:'媽媽傳訊息來。',m:{from:'媽媽',x:'今天開齋吃什麼？家裡煮了你愛的椰漿飯。'},r:['吃得很好，別擔心。','泡麵。但是很好吃。']},

  {s:'dorm',f:{},w:0,x:'晚上，媽媽傳訊息來。',m:{from:'媽媽',x:'這個月的錢收到了。你的聲音聽起來很累。'},r:['沒事。','（看了訊息，沒有回）']},
  {x:'我不知道要怎麼跟她說。'}],
 [{s:'factory',f:{boss:1},w:.4,signs:[],x:'星期五，機器突然停了。整條生產線都在等。領班急得滿頭大汗。'},
  {x:'我聽了一下聲音。是皮帶鬆了。在家鄉，我修過一百次這種毛病。'},
  {x:'我比了比工具箱。領班猶豫了一下，點點頭。十分鐘後，機器又轉起來了。'},
  {f:{boss:1,up:1},x:'領班對我比了大拇指。這個我看得懂。'},
  {s:'canteen',f:{co:1},w:.55,x:'隔天中午，那位同事坐到我旁邊。他叫阿凱。他拿出手機給我看。'},
  {x:'他查了「齋戒月」，螢幕上是印尼文。他指指太陽，再指指便當，搖搖手。'},
  {who:'阿凱',x:'Selamat... puasa？'},
  {x:'他的發音好奇怪。可是我聽懂了。他在用我的話，祝我齋戒順利。'},
  {x:'晚上，宿舍門口放著一個沒有豬肉的便當，上面貼著紙條。',d:{t:'紙條',l:['阿迪：','太陽下山再吃。']}},
  {x:'隔天，阿凱拿出四張卡片教我。先點每一張，聽他念。',play:{t:'learn',k:'阿凱教我中文',e:'有人願意慢慢教，學起來就不一樣。阿凱只花了午休的十分鐘。',words:[{t:'太陽',e:'☀️'},{t:'吃飯',e:'🍚'},{t:'豬肉',e:'🐷'},{t:'謝謝',e:'🙏'}]}},
  {learn:'太陽下山再吃',x:'我再看一次那張紙條。這次，我看懂了。',d:{t:'紙條',l:['阿迪：','太陽下山再吃。']}},
  {x:'我也教阿凱印尼話的「謝謝」：Terima kasih。'},
  {s:'field',f:{up:1},w:.7,x:'星期天，阿凱帶我去河邊的球場。台灣人、印尼人、越南人，分兩隊踢球。'},
  {x:'我進了兩球。沒有人在意我的中文好不好。'},
  {x:'媽媽傳訊息來。',m:{from:'媽媽',x:'開齋節快到了。'},r:['媽，開齋節那天我們放假。我交到一個台灣朋友，他說想吃妳煮的椰漿飯。','媽，我今天踢球了，進了兩球！下個月我會多寄一點錢。']}],
 [{tw:1,s:'field',f:{me:1},w:.55,x:'現在，換一個人。你是你自己：一個台灣的小學生。'},
  {x:'星期天，你和朋友在河邊球場踢球。場邊站著一位大哥哥，一直看著你們。'},
  {x:'他穿著工廠的制服。你的朋友小聲說：「是外勞耶，不要理他。」'},
  {x:'你覺得那句話聽起來不太舒服。老師說過，他們是「移工」，是來台灣工作的人。'},
  {x:'球滾到他的腳邊。他用腳尖把球挑起來，頂了三下，笑著說了一句話。'},
  {who:'大哥哥',g:'all',x:'要不要一起踢？我以前是前鋒。'},
  {c:{k:'換你在球場遇見大哥哥',q:'你聽不懂他說什麼。你會怎麼做？',o:[
    {l:'招招手：「一起踢！」',e:'一句邀請，他就從場邊的陌生人變成隊友。',then:[{w:.85,f:{me:1,in:1},x:'他跑進場，一腳射門得分。你的朋友看呆了：「他好強！」'},{x:'天黑以前，他教了你一招假動作。你教了他一個詞：「好球」。'}]},
    {l:'指指自己，說出名字，再指指他',e:'知道名字以後，他就不再是「那個外勞」，而是阿迪。',then:[{w:.85,f:{me:1,in:1},x:'「阿、迪。」他慢慢地說。你學著念了一次，他笑得很開心。'},{x:'天黑以前，他教了你一招假動作。你教了他一個詞：「好球」。'}]},
    {l:'跟朋友說：「他是來工作的人，又不是壞人。」',e:'你改變的不只是自己，還有朋友的想法。這需要勇氣。',then:[{w:.8,f:{me:1,in:1},x:'朋友想了一下，點點頭。他把球踢向大哥哥：「接著！」'},{x:'天黑以前，他教了你們一招假動作。你們教了他一個詞：「好球」。'}]},
    {l:'把球撿回來，繼續踢自己的',e:'你沒有傷害他。可是他在台灣的星期天，還是一個人過的。',then:[{x:'你把球拿回來。大哥哥在場邊又站了一會兒，才慢慢走開。'},{x:'你沒有趕他走。如果再來一次，你會想試試別的做法嗎？'}]}]}}]]},

maria:{name:'瑪莉亞',tag:'移工',from:'菲律賓',role:'住在雇主家，照顧失智的阿嬤',good:'很有耐心，歌唱得很好',init:'一二三人好',
 end:{ep:'阿嬤還是常常忘記瑪莉亞的名字。可是只要瑪莉亞一開口唱歌，阿嬤就會跟著打拍子。',
  reps:[['關鍵評論網','很多看護工一整年都沒有一天完整的休假。','https://www.thenewslens.com/article/100429'],['中央社（關鍵評論網轉載）','看護工和長輩住在一起，常常整天、整夜都在工作。','https://www.thenewslens.com/article/268522']]},
 stages:[
 [{s:'home',f:{v:'sea',kid:1},w:1,x:'這裡是菲律賓的海邊小鎮。星期天，教堂的歌聲會傳到整條街。'},
  {x:'我叫瑪莉亞，35 歲。我在鎮上的診所當過助手，很會照顧人。'},
  {x:'我也愛唱歌。女兒貝雅睡不著的時候，我唱一首，她就睡了。'},
  {x:'貝雅又睡不著了。音符出現的時候，點它，把歌唱完。',play:{t:'rush',k:'唱歌哄女兒睡覺',e:'在家鄉，她是貝雅的媽媽。來台灣以後，她哄睡的是別人的家人。',icons:['🎵','🎶'],n:7,life:1900,gap:1000,done:(h,m)=>[`我唱了 ${h} 個音。貝雅抓著我的手指，睡著了。`]}},
  {x:'貝雅今年 8 歲。我想讓她念到大學。所以我要去台灣當看護，照顧別人的家人。'},
  {x:'合約是三年。這三年，我大概只能在手機裡看她長大。'},
  {x:'出發那天，貝雅用外婆的手機傳訊息給我。',m:{from:'貝雅',x:'媽媽，妳什麼時候回來？'},r:['三年後。媽媽每天晚上都會打給妳，唱歌給妳聽。','等妳升上五年級，媽媽就回來。要聽外婆的話喔。']}],
 [{s:'room',f:{wife:1},w:.15,x:'台灣。我住進一戶人家，照顧 82 歲的阿嬤。她有失智症，常常忘記事情。'},
  {x:'我的床在阿嬤的床旁邊。她半夜醒來，我也要醒來。'},
  {who:'太太',g:'tw',x:'阿嬤的藥早晚各一次，血壓要量，垃圾星期二四六倒。'},
  {x:'太太講了很多事，還給我一張表。我只看得懂上面的時間。',d:{t:'每日工作表',l:['06:00　起床、量血壓','07:00　早餐、吃藥','10:00　散步','12:00　午餐','15:00　洗澡','18:00　晚餐、吃藥','22:00　睡覺','半夜　陪阿嬤上廁所']}},
  {x:'從早上 6 點到晚上 10 點。最後一行沒有寫時間。'},
  {f:{},who:'阿嬤',g:'all',x:'你是誰？阿美呢？我要找阿美。'},
  {x:'阿嬤看著我，說了一串話。那不是我學過的中文。太太說，阿嬤講的是台語。'},
  {x:'我在菲律賓學了三個月的中文。在這裡，一句都用不上。'},
  {x:'阿嬤一直說同一句話，越說越急。她要什麼？拿給她試試看。',play:{t:'find',k:'猜阿嬤要什麼',e:'語言不通的時候，照顧一個人只能用猜的。猜不到，兩個人都難過。',max:3,items:[
    {e:'💧',fb:'阿嬤把水杯推開。不是這個。'},{e:'🍪',fb:'阿嬤搖搖頭。她不餓。'},{e:'🧣',fb:'阿嬤把毯子拉掉。她不冷。'},
    {e:'💊',fb:'阿嬤皺起眉頭。吃藥的時間還沒到。'},{e:'📺',fb:'我打開電視。阿嬤看都不看。'},{e:'🚽',fb:'我扶她去廁所。她站在門口，不肯進去。'}],
    done:t=>['我試了三樣，都不是。她一直看著門口。','她要的東西，這個房間裡好像沒有。']}}],
 [{s:'room',w:.25,x:'一個月過去了。我學會煮阿嬤愛吃的稀飯，也學會幫她量血壓。'},
  {x:'一天的工作開始了。事情出現的時候，點它，把它做完。',play:{t:'rush',k:'看護的一天',e:'事情一件接一件，沒有下班時間。很多家庭看護工，每天都是這樣過的。',icons:['🩺','🍚','💊','🚶','🧺','🛁','🍚','💊','🗑️','🚽'],n:14,life:1700,gap:800,
    done:(h,m)=>[`做完 ${h} 件事，來不及做 ${m} 件。晚上十點，阿嬤終於睡了。`,'半夜兩點，阿嬤叫我。這一件，工作表上沒有寫時間。']}},
  {x:'阿嬤還是每天問同一句話。我還是聽不懂。'},
  {x:'太太傳訊息來。我用 App 翻譯，這次翻對了：星期天不能休假。',m:{from:'太太',g:'tw',x:'這個星期天我們要出門，你不能休假，改天再補。'}},
  {x:'這是第四個沒有休假的星期天。合約上寫，每個星期可以休息一天。'},
  {f:{wife:1},c:{k:'連續四個星期天沒有休假',q:'我要不要跟太太說？',o:[
    {l:'跟太太說：我想休星期天',e:'說出自己的需要是對的。雇主也有難處，問題出在沒有別人可以接手。',then:[{x:'太太有點為難：「妳休假，阿嬤誰顧？」她沒有說不行，也沒有說可以。'}]},
    {l:'不說，繼續工作',e:'家裡維持了平靜。可是一直不休息，照顧別人的人自己也會倒下。',then:[{x:'我沒有說。星期天，同鄉在教堂聚會的照片，一張一張傳到我的手機裡。'}]},
    {l:'問可不可以只休半天',e:'兩邊各退一步。可是阿嬤哭了，她會覺得休息是自己的錯。',then:[{x:'太太答應了。我去了教堂兩個小時。回來時，阿嬤正在哭，說找不到人。'}]}]}},
  {x:'太太和先生都要上班，也很累。他們不是壞人。只是這個家，沒有第二個人可以顧阿嬤。'},
  {f:{},w:.18,x:'晚上十點，阿嬤睡了。這是我一天裡，唯一屬於自己的時間。'},
  {x:'視訊裡，貝雅掉了一顆門牙。我不知道它是哪一天掉的。',m:{from:'貝雅',x:'媽媽，今天學校表演，我唱了妳教我的歌。'}},
  {x:'我要怎麼回她？',r:['媽媽好想看。請外婆錄下來傳給我，好不好？','妳好棒。']}],
 [{s:'room',f:{up:1},w:0,x:'凌晨三點。阿嬤醒了，說要回家。她不知道，這裡就是她的家。'},
  {who:'阿嬤',g:'all',x:'我要回去！阿美在等我！你們把我關在這裡！'},
  {x:'她推開我，往門口走。我擋在門前。她哭了，我也快哭了。'},
  {c:{k:'半夜阿嬤吵著要回家',q:'我要怎麼辦？',o:[
    {l:'輕輕地用英文跟她說話',e:'聽不懂內容，還是聽得出語氣。慢慢說、輕輕說，本身就是一種語言。',then:[{x:'「It’s okay, Lola.」她聽不懂。可是我的聲音很慢，她的腳步也慢了一點。'}]},
    {l:'打電話叫醒太太',e:'問題解決了。可是她會擔心，雇主覺得她做得不夠好。',then:[{f:{up:1,wife:1},x:'太太下樓來，講了幾句台語，阿嬤才肯坐下。太太看了我一眼，沒有說話就回房了。'}]},
    {l:'扶著她在客廳慢慢走',e:'阿嬤安心了。代價是她自己一整晚沒有睡。',then:[{x:'我扶著她在客廳走了三圈。她走累了，才肯回床上。那時候，天快亮了。'}]}]}},
  {f:{down:1},x:'早上六點，鬧鐘響了。新的一天又開始。我昨晚只睡了兩個小時。'},
  {x:'我照顧阿嬤，可是沒有人問我累不累。'},
  {x:'我的女兒在想我。可是我在這裡，照顧別人的媽媽。'},
  {x:'手機亮了。',m:{from:'貝雅',x:'媽媽，妳昨天沒有打給我。'},r:['對不起。','（看了訊息，沒有回）']},
  {x:'我太累了。手機還握在手裡，就睡著了。'}],
 [{s:'room',f:{kid:1},w:.4,x:'下午，阿嬤的孫子小恩放學回來。他今年五年級，會講國語，也聽得懂台語。'},
  {x:'阿嬤又說了那句話。我指指阿嬤，再對小恩攤開手：她在說什麼？'},
  {who:'小恩',x:'她在找阿美。阿美是阿嬤的妹妹，小時候常常一起唱歌。'},
  {x:'小恩用手機打字，翻成英文給我看。原來阿嬤每天在找的，是她的妹妹。'},
  {x:'原來她也在想家人。跟我一樣。'},
  {x:'阿嬤又說了那句話。這次，我知道她在找什麼了。',play:{t:'find',k:'再猜一次阿嬤要什麼',e:'聽懂了一句話，事情就完全不一樣。小恩只是幫忙翻譯了一次。',items:[
    {e:'💧',fb:'不是水。她在找一個人。'},{e:'🖼️',ok:1,fb:'我拿出相簿，翻到阿嬤和妹妹的合照。'},{e:'🍪',fb:'不是餅乾。她在找一個人。'},{e:'🧣',fb:'不是毯子。她在找一個人。'}],
    done:t=>['阿嬤摸著照片，笑了。她說了很多話。我聽不懂，可是我一直點頭。']}},
  {w:.5,x:'那天晚上，阿嬤又睡不著。我沒有說話。我開始唱歌，唱我哄貝雅睡覺的那一首。'},
  {x:'阿嬤安靜下來。她跟著哼，哼的是另一首歌，可是拍子一樣。'},
  {x:'隔天，小恩拿出四張卡片教我。先點每一張，聽他念。',play:{t:'learn',k:'小恩教我中文',e:'一天學幾個字，慢慢就看得懂工作表。願意教的人，不一定要是老師。',words:[{t:'吃藥',e:'💊'},{t:'睡覺',e:'🛏️'},{t:'散步',e:'🚶'},{t:'洗澡',e:'🛁'}]}},
  {learn:'起床早餐吃藥午晚睡覺散步洗澡',x:'我再看一次工作表。上面的字，我看懂一半了。',d:{t:'每日工作表',l:['06:00　起床、量血壓','07:00　早餐、吃藥','10:00　散步','12:00　午餐','15:00　洗澡','18:00　晚餐、吃藥','22:00　睡覺','半夜　陪阿嬤上廁所']}},
  {x:'現在每天下午四點，小恩寫功課，我學十個字。阿嬤在旁邊打拍子。'},
  {f:{kid:1,wife:1},w:.6,x:'太太看見了。她說，下個月開始，星期天請居家照顧的人來幫忙，讓我休假。'},
  {s:'park',w:.75,x:'星期天，我去了教堂。我站在最前面唱歌。同鄉說，我的聲音一點都沒變。'},
  {x:'晚上視訊，貝雅盯著我看了很久。',m:{from:'貝雅',x:'媽媽，妳今天在笑。'},r:['因為媽媽今天唱歌了。阿嬤的孫子跟妳差不多大，他在教媽媽寫中文字。','媽媽學了一首台灣的老歌。今天晚上唱給妳聽。']}],
 [{tw:1,s:'room',f:{me:1},w:.55,x:'現在，換一個人。你是你自己：一個台灣的小學生。'},
  {x:'放學回家，家裡多了一位看護阿姨，她是來照顧你阿嬤的。她來自菲律賓。'},
  {who:'阿姨',g:'all',x:'你好，我叫瑪莉亞。你叫什麼名字？'},
  {x:'她對你笑，說了一句你聽不懂的話。'},
  {x:'阿嬤開始說台語。阿姨聽不懂，一臉著急。你聽得懂：阿嬤說她口渴。'},
  {c:{k:'換你是家裡聽得懂兩邊的人',q:'你會怎麼做？',o:[
    {l:'指指阿嬤，再比一個喝水的動作',e:'你一個動作，省下她猜四次的時間。阿嬤也少著急一會兒。',then:[{w:.85,x:'阿姨馬上倒了溫水。阿嬤喝了，拍拍阿姨的手。阿姨對你比了一個讚。'}]},
    {l:'教阿姨一個詞：「喝水」',e:'你教的一個詞，她以後每天都用得到。',then:[{w:.85,x:'「喝、水。」阿姨念了三次，寫在手心。下一次，她自己就聽懂了。'}]},
    {l:'用手機翻譯，問阿姨：「妳的家人在哪裡？」',e:'你讓她知道，有人把她當成一個有家人的人，而不只是看護。',then:[{w:.8,x:'阿姨給你看一張照片：一個掉了門牙的小女孩。翻譯 App 說：「跟你差不多大。」'},{x:'你想起來阿嬤還在等水，趕快告訴阿姨。'}]},
    {l:'回房間寫功課',e:'你沒有做錯事。只是那天下午，她和阿嬤都多辛苦了一點。',then:[{f:{me:1,solo:1},x:'你回房間了。客廳裡，阿姨倒了茶、拿了毯子，試到第四次才猜對。'},{x:'你沒有做錯事。只是，你剛好是家裡唯一聽得懂兩邊的人。'}]}]}},
  {x:'晚上，你聽見阿嬤的房間有歌聲。是你沒聽過的語言，可是很好聽。'}]]}
};

let AC=null,MG=null,ambN=[],thump=0,snd=true;

function tone(f,d,v=.05,ty='square',t=0){const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
  o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(MG);o.start(s);o.stop(s+d+.02)}
const AMB={home:[.02,1200,196],store:[.03,3200,0],kitchen:[.025,1600,0],night:[.01,300,82],class:[.012,1000,262],factory:[.09,420,55],dorm:[.012,500,98],canteen:[.04,1800,0],field:[.02,2600,0],room:[.01,600,110],park:[.015,2400,330]};

  const a=au();if(!a||!AMB[id])return;const[v,fc,dr]=AMB[id];
  const buf=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource();n.buffer=buf;n.loop=true;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fc;
  const g=a.createGain();g.gain.value=v;n.connect(fl);fl.connect(g);g.connect(MG);n.start();ambN.push(n);
  if(0&&dr){const o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.value=dr;og.gain.value=.025;o.connect(og);og.connect(MG);o.start();ambN.push(o)}
  if(id==='factory')thump=setInterval(()=>tone(58,.12,.12,'sine'),640)}

/* ───── 小遊戲：rush 來不及的事 / find 看不懂只能猜 / learn 記住陌生的字 ───── */
let G=null,CURP=null;
function stopGame(){if(G){G.t.forEach(clearTimeout);G=null}const L=$('#game');L.innerHTML='';L.className=''}
function endGame(lines,logv,k){stopGame();if(S.f.lamp){S.f={...S.f,lamp:0};draw()}if(k)S.log.push([k,logv,CURP&&CURP.e]);S.beats.splice(S.i+1,0,...lines.map(x=>({x})));next()}
function play(p){const L=$('#game');G={t:[]};CURP=p;const later=(f,ms)=>G.t.push(setTimeout(f,ms));
  const say=t=>{$('#txt').textContent=t};
  if(p.t==='rush'){let hit=0,miss=0,bad=0,left=p.n,lamp=false;
    const fin=()=>{if(--left>0)return;endGame(p.done(hit,miss,bad),`做到 ${hit} 個，漏掉 ${miss} 個`+(p.lamp?`，燈亮時伸手 ${bad} 次`:''),p.k)};
    if(p.lamp){const flip=()=>{lamp=!lamp;S.f={...S.f,lamp};draw();L.classList.toggle('lamp',lamp);tone(lamp?170:260,.1,.05);later(flip,lamp?p.lamp[0]:p.lamp[1])};later(flip,p.lamp[1])}
    for(let i=0;i<p.n;i++)later(()=>{const b=document.createElement('button');b.type='button';b.className='tgt';b.innerHTML=ico(p.icons[i%p.icons.length]);b.setAttribute('aria-label','點這裡');
      const z=p.at?p.at[i%p.at.length]:[12+Math.random()*76,20+Math.random()*56];b.style.left=z[0]+'%';b.style.top=z[1]+'%';b.style.setProperty('--life',p.life+'ms');
      let dead=false;const kill=()=>{dead=true;b.remove()};
      b.onclick=()=>{if(dead)return;if(lamp){bad++;tone(110,.25,.08,'sawtooth');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}hit++;tone(480+hit*30,.07);kill();fin()};
      L.append(b);paintIcons();later(()=>{if(dead)return;miss++;kill();fin()},p.life)},500+i*p.gap)}
  else if(p.t==='find'){let tries=0,found=0;const need=p.items.filter(i=>i.ok).length;
    L.innerHTML=`<div class="ov"><div class="grid" style="--c:${p.items.length>4?3:2}">${p.items.map((it,i)=>`<button type="button" class="tile" data-i="${i}">${ico(it.e)}${it.t?`<span>${units(it.t,'tw').join('')}</span>`:''}</button>`).join('')}</div></div>`;paintIcons();
    L.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled||!G)return;const it=p.items[b.dataset.i];tries++;b.disabled=true;b.classList.add(it.ok?'yes':'no');
      tone(it.ok?660:150,.12,.06,it.ok?'square':'sawtooth');say(it.fb);if(it.ok)found++;
      if(need?found>=need:tries>=p.max){L.querySelectorAll('.tile').forEach(t=>t.disabled=true);
        $('#acts').replaceChildren(btn('next','繼續 ▶',()=>endGame(p.done(tries),`試了 ${tries} 次`,p.k)))}}}
  else{const W=p.words;let seen=new Set(),wrong=0,q=shuf(W),cur=null;
    L.innerHTML=`<div class="ov"><div class="grid" style="--c:2">${W.map((w,i)=>`<button type="button" class="tile" data-i="${i}"><span class="w">${units(w.t,'all').join('')}</span><span class="m" hidden>${ico(w.e)}${esc(w.t)}</span></button>`).join('')}</div></div>`;
    const ask=()=>{cur=q.shift();if(!cur)return endGame([wrong?`我錯了 ${wrong} 次，可是四個詞都記住了。`:'四個詞，我一次就記住了。'],`學會 ${W.length} 個詞，錯了 ${wrong} 次`,p.k);
      say('哪一張卡片，是這個意思？');
      L.innerHTML=`<div class="ov quiz"><div class="q">${ico(cur.e)}<span>${esc(cur.t)}</span></div><div class="grid" style="--c:2">${shuf(W).map(w=>`<button type="button" class="tile" data-t="${w.t}"><span class="w">${units(w.t,'all').join('')}</span></button>`).join('')}</div></div>`;paintIcons()};
    L.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled||!G)return;
      if(b.dataset.i!=null){const w=W[b.dataset.i];b.querySelector('.m').hidden=false;paintIcons();tone(400+b.dataset.i*60,.1,.05,'triangle');seen.add(w.t);say(`這個詞的意思是「${w.t}」。記住它的樣子。`);
        if(seen.size===W.length&&!$('#acts').firstChild)$('#acts').replaceChildren(btn('next','記住了，開始考試 ▶',()=>{$('#acts').replaceChildren();ask()}));return}
      if(b.dataset.t===cur.t){b.classList.add('yes');b.querySelector('.w').textContent=cur.t;for(const c of cur.t)S.known.add(c);
        [523,659,784].forEach((f,i)=>tone(f,.12,.05,'triangle',i*.09));L.querySelectorAll('.tile').forEach(t=>t.disabled=true);later(ask,1100)}
      else{wrong++;b.disabled=true;b.classList.add('no');tone(150,.12,.06,'sawtooth');say('不是這一張。再看一次形狀。')}}}}
$('#txt').onclick=()=>{if(tw)tw.finish()};

function finish(){stopGame();const ch=C[S.cid];S.stage=6;dots(6);show('end');warm(.8);ambience('home');
  $('#end').innerHTML=`<h1>${ch.name}是虛構的人物。可是她遇到的事，是真的。</h1>`.replace('她',S.cid==='adi'?'他':'她')+
   `<p class="ep">${esc(ch.ep||ch.end.ep)}</p>
   <div><h2>真實的報導</h2><ul>${ch.end.reps.map(r=>`<li><small>${esc(r[0])}</small>${esc(r[1])}<br><a href="${r[2]}" target="_blank" rel="noopener">打開這篇報導 ↗</a></li>`).join('')}</ul></div>
   <div class="ask"><h2>等一下和同學說</h2><ul><li>哪一刻你最卡住、最不舒服？</li><li>${ch.name}遇到的困難，是因為${S.cid==='adi'?'他':'她'}做錯了什麼嗎？</li><li>在學校或家附近，你可以做的一件事是什麼？</li></ul></div>
   <div class="wide"><h2>我的選擇，和它可能的影響</h2><p class="hint">沒有哪個選擇完全對，或完全錯。每一個都換來一些東西，也有代價。</p><ul>${S.log.map(l=>`<li><small>${esc(l[0])}</small>${esc(l[1])}${l[2]?`<p class="fx">${esc(l[2])}</p>`:''}</li>`).join('')||'<li>這次沒有留下選擇紀錄。</li>'}</ul></div>
   <div class="wide"><h2>全班一起讀</h2><ul><li><small>公視新聞</small>有些移工離開了原本的工作，變成「失聯移工」。這常常和債務、語言不通有關。<br><a href="https://news.pts.org.tw/article/662345" target="_blank" rel="noopener">打開這篇報導 ↗</a></li></ul></div>`;
  $('#end').append(Object.assign(btn('sm back','回首頁',home)))}
function home(){stopGame();clearTimeout(mus);S=null;curAmb&&ambience('');curAmb='';show('home');W=.6;pal(W)}

/* ───── 首頁與教師面板 ───── */
$('#cards').innerHTML=Object.entries(C).map(([k,c])=>`<button class="card" type="button" data-c="${k}"><span class="tag">${c.tag}・${c.from}</span><strong>${c.name}</strong><span>${c.role}</span><span>${c.good}</span></button>`).join('');
$('#cards').onclick=e=>{const b=e.target.closest('[data-c]');if(b){au();begin(b.dataset.c)}};
$('#tChar').innerHTML=Object.entries(C).map(([k,c])=>`<option value="${k}">${c.name}（${c.tag}）</option>`).join('');
$('#tStage').innerHTML=STG.slice(0,6).map((n,i)=>`<option value="${i}">${i+1}．${n}</option>`).join('');
$('#bT').onclick=()=>{$('#teacher').hidden=!$('#teacher').hidden};
$('#tGo').onclick=()=>{au();begin($('#tChar').value,+$('#tStage').value)};
$('#tBig').onclick=()=>{const on=document.body.classList.toggle('big');$('#tBig').textContent='投影模式：'+(on?'開':'關')};
$('#tHome').onclick=()=>{$('#teacher').hidden=true;home()};

/* 標題：先是看不懂的符號，再一個字一個字變回中文 */
(function(){const T='他鄉的第一年',el=$('#ttl');S={readAll:false,known:new Set(),fresh:new Set()};
  const full=()=>{el.textContent=T};if(RM){S=null;return full()}
  el.innerHTML=units(T,'all').join('');S=null;let n=0;
  const t=setInterval(()=>{n++;el.innerHTML=esc(T.slice(0,n))+[...T.slice(n)].map(c=>`<i class="g ${glyph(c)}"></i>`).join('');if(n>=T.length)clearInterval(t)},260)})();

pal(W);
const boot=d=>{if(d&&d.cid&&C[d.cid])begin(d.cid,d.st||0)};
window.claude?.hot?.snapshot?.(()=>S&&!$('#play').hidden?{cid:S.cid,st:Math.min(S.stage,5)}:{});
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
</body>
</html>
